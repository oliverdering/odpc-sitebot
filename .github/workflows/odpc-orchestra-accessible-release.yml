name: ODPC orchestra contrast release
on:
  push:
    branches: ['work/orchestra-contrast-20261114']
    paths: ['.github/workflows/odpc-orchestra-accessible-release.yml']
permissions:
  contents: read
concurrency:
  group: odpc-orchestra-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify tested source
        run: |
          test "$(git rev-parse HEAD:mission-control-accessible/index.html)" = "42af91a2224864b6058a54434eb27dc775beef86"
          python3 -m py_compile mission-control-accessible/deploy.py
      - run: python3 -m pip install 'paramiko>=3.4,<5'
      - name: Deploy one page with backup and verification
        env:
          ODPC_SFTP_PASSWORD: ${{ secrets.ODPC_SFTP_PASSWORD }}
          AI_ODPC_THEME_PATH: ${{ secrets.AI_ODPC_THEME_PATH }}
        run: python3 -m mission-control-accessible.deploy
      - name: Preserve previous version
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orchestra-accessible-previous
          path: orchestra-accessible-backup/
          retention-days: 15
          if-no-files-found: ignore
