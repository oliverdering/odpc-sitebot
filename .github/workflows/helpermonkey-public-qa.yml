name: Helper Monkey public availability QA
on:
  workflow_dispatch:
  schedule:
    - cron: '41 6 * * *'
permissions:
  contents: read
jobs:
  public-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check essential pages and visible identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request, urllib.error
          checks = {
            "https://ai.odpc.de/": ["helper"],
            "https://ai.odpc.de/start/": ["helper"],
            "https://ai.odpc.de/connector-einrichten/": ["connector"],
            "https://ai.odpc.de/werkstatt/": ["werkstatt"],
            "https://ai.odpc.de/sprachen/": ["sprach"],
            "https://ai.odpc.de/praxis/": ["praxis"],
            "https://ai.odpc.de/webmaster-agent/": ["webmaster"],
            "https://ai.odpc.de/finanzen-vertragscheck/": ["finanz"],
            "https://ai.odpc.de/konfliktlotse-anwaltsvorarbeit/": ["konflikt"],
            "https://ai.odpc.de/helper-monkey-einfach-starten-sprachassistent/": ["helper"],
            "https://ai.odpc.de/helper-monkey-fuer-unternehmen-ki-kollegen/": ["helper"],
            "https://odpc.de/smartphone-ki-helfer-connector-einfach-erklaert": ["connector"],
          }
          failures=[]
          for url, terms in checks.items():
            try:
              req=urllib.request.Request(url,headers={"User-Agent":"ODPC-Public-QA/1.0"})
              with urllib.request.urlopen(req,timeout=25) as response:
                body=response.read(3_000_000).decode("utf-8","replace").lower()
                status=response.status
              missing=[term for term in terms if term not in body]
              print(f"{'PASS' if not missing else 'FAIL'} {status} {url} missing={missing}")
              if missing: failures.append(url+": missing "+str(missing))
            except Exception as e:
              print(f"FAIL {url}: {e}")
              failures.append(url+": "+str(e))
          if failures:
            raise SystemExit("\n".join(failures))
          PY
      - name: Inspect public download links
        shell: bash
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from urllib.parse import urljoin,urlparse
          from urllib.request import Request,urlopen
          import urllib.error
          class Links(HTMLParser):
            def __init__(self): super().__init__(); self.links=[]
            def handle_starttag(self,tag,attrs):
              if tag=="a":
                h=dict(attrs).get("href")
                if h and (".zip" in h.lower() or "/downloads/" in h.lower()): self.links.append(h)
          sources=["https://ai.odpc.de/","https://ai.odpc.de/start/","https://ai.odpc.de/connector-einrichten/","https://ai.odpc.de/sprachen/"]
          links=set()
          for source in sources:
            try:
              with urlopen(Request(source,headers={"User-Agent":"ODPC-Public-QA/1.0"}),timeout=25) as f:
                page=f.read(2_000_000).decode("utf-8","replace")
              p=Links();p.feed(page)
              links.update(urljoin(source,h) for h in p.links)
            except Exception as e:
              print("SOURCE UNAVAILABLE:",source,e)
          if not links:
            raise SystemExit("No download links discovered: check site content/markup")
          failures=[]
          for url in sorted(links):
            host=urlparse(url).hostname or ""
            if host not in ("ai.odpc.de","odpc.de","raw.githubusercontent.com","github.com"):
              print("EXTERNAL (not downloaded):",url);continue
            try:
              req=Request(url,headers={"User-Agent":"ODPC-Public-QA/1.0","Range":"bytes=0-3"})
              with urlopen(req,timeout=25) as f:
                status=f.status
                start=f.read(4)
              is_zip=urlparse(url).path.lower().endswith('.zip')
              ok=status in (200,206) and (start.startswith(b"PK") if is_zip else bool(start) and not start.lstrip().startswith(b"<"))
              print(("PASS" if ok else "FAIL"),url,"status",status,"signature",start)
              if not ok: failures.append(url)
            except Exception as e:
              print("FAIL",url,e);failures.append(url)
          if failures:raise SystemExit("Unavailable/invalid download: "+", ".join(failures))
          PY
