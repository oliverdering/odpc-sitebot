name: Orchestra visual and translation QA
on:
  push:
    branches: [work/orchestra-polish-20261114]
    paths: ['.github/workflows/orchestra-polish-qa.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: node mission-control-polish/test.cjs
