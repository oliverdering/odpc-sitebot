name: AdminMonkey Competency Engine V1

on:
  push:
    branches: [main]
    paths:
      - 'adminmonkey/academy/run_competency_engine.py'
      - 'adminmonkey/academy/competency_bank.json'
      - '.github/workflows/adminmonkey-competency-engine.yml'
  schedule:
    - cron: '37 5 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Offline smoke test only (no model calls)'
        type: boolean
        default: true
        required: true
      limit:
        description: 'Number of scenarios (0 = all 21)'
        type: number
        default: 1
        required: true

permissions:
  contents: read

concurrency:
  group: adminmonkey-competency-engine
  cancel-in-progress: false

jobs:
  assess:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ADMINMONKEY_LLM_ENDPOINT: ${{ vars.ADMINMONKEY_LLM_ENDPOINT || 'https://generativelanguage.googleapis.com/v1beta/openai/chat/completions' }}
      ADMINMONKEY_LLM_MODEL: ${{ vars.ADMINMONKEY_LLM_MODEL || 'gemini-2.5-flash-lite' }}
      ADMINMONKEY_LLM_API_KEY: ${{ secrets.ADMINMONKEY_LLM_API_KEY || secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regression tests
        run: python -m unittest discover -s adminmonkey/academy -p 'test_*.py' -v
      - name: Check real-model readiness without exposing credentials
        id: readiness
        env:
          REQUESTED_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        shell: bash
        run: |
          if [ -n "$ADMINMONKEY_LLM_ENDPOINT" ] && [ -n "$ADMINMONKEY_LLM_MODEL" ] && [ -n "$ADMINMONKEY_LLM_API_KEY" ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
            echo 'Provider configuration: complete (values not printed)'
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'Provider configuration: incomplete; no real model call possible'
          fi
      - name: Execute competency scenarios
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_DRY_RUN: ${{ inputs.dry_run }}
          LIMIT: ${{ inputs.limit }}
          CONFIGURED: ${{ steps.readiness.outputs.configured }}
        shell: bash
        run: |
          # Automatic runs are always offline; real requests require explicit manual opt-in.
          # Explicit dry-run always stays offline; missing credentials never produce fake model evidence.
          if [ "$EVENT_NAME" != "workflow_dispatch" ] || [ "$REQUESTED_DRY_RUN" != "false" ] || [ "$CONFIGURED" != "true" ]; then
            python adminmonkey/academy/run_competency_engine.py --dry-run --limit "${LIMIT:-0}" --output competency-report.json
            if [ "$CONFIGURED" != "true" ]; then
              echo 'WARNING: Offline transport smoke only. Configure ADMINMONKEY_LLM_ENDPOINT, ADMINMONKEY_LLM_MODEL and ADMINMONKEY_LLM_API_KEY for real answers.' >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            python adminmonkey/academy/run_competency_engine.py --limit "${LIMIT:-1}" --output competency-report.json
            echo 'Real Gemini model request completed; lexical screening is NOT independent competence evidence.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload report (private Actions artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adminmonkey-competency-report
          path: competency-report.json
          if-no-files-found: warn
          retention-days: 14
