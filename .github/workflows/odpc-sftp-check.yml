name: ODPC / WordPress SFTP connection check
on:
  push:
    paths:
      - '.github/workflows/odpc-sftp-check.yml'
  workflow_dispatch:
    inputs:
      site:
        description: "WordPress-Ziel: Hauptwebsite oder Helper Monkey"
        required: true
        type: choice
        default: odpc.de
        options:
          - odpc.de
          - ai.odpc.de
      operation:
        description: "Fingerprint only (no login), or authenticated read-only theme check"
        required: true
        type: choice
        default: fingerprint
        options:
          - fingerprint
          - discover
          - check
permissions:
  contents: read
concurrency:
  group: odpc-connection-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install read-only SFTP client
        run: python -m pip install "paramiko>=3.4,<5"
      - name: Verify server fingerprint and optionally authenticate (read-only)
        env:
          ODPC_SFTP_MODE: ${{ github.event_name == 'push' && 'fingerprint' || inputs.operation }}
          ODPC_TARGET_SITE: ${{ github.event_name == 'push' && 'odpc.de' || inputs.site }}
          ODPC_SFTP_HOST: ${{ secrets.ODPC_SFTP_HOST || 'home119567219.1and1-data.host' }}
          ODPC_SFTP_PORT: "22"
          ODPC_SFTP_USER: ${{ secrets.ODPC_SFTP_USER || 'acc1461323326' }}
          ODPC_SFTP_PASSWORD: ${{ secrets.ODPC_SFTP_PASSWORD }}
          ODPC_SFTP_HOSTKEY_SHA256: ${{ secrets.ODPC_SFTP_HOSTKEY_SHA256 || 'SHA256:1gx2w8Rtv3wCgi7Jh8myf/KVd72cRQbow03UP8P095Q' }}
          ODPC_THEME_PATH: ${{ secrets.ODPC_THEME_PATH }}
          AI_ODPC_THEME_PATH: ${{ secrets.AI_ODPC_THEME_PATH }}
        run: python scripts/check_wordpress_sftp.py
