name: ODPC / WordPress SFTP connection check
on:
  workflow_dispatch:
    inputs:
      site:
        description: "WordPress-Ziel: Hauptwebsite oder Helper Monkey"
        required: true
        type: choice
        default: odpc.de
        options:
          - odpc.de
          - ai.odpc.de
      operation:
        description: "Fingerprint only (no login), or authenticated read-only theme check"
        required: true
        type: choice
        default: fingerprint
        options:
          - fingerprint
          - check
permissions:
  contents: read
concurrency:
  group: odpc-connection-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install read-only SFTP client
        run: python -m pip install "paramiko>=3.4,<5"
      - name: Verify server fingerprint and optionally authenticate (read-only)
        env:
          ODPC_SFTP_MODE: ${{ inputs.operation }}
          ODPC_TARGET_SITE: ${{ inputs.site }}
          ODPC_SFTP_HOST: ${{ secrets.ODPC_SFTP_HOST }}
          ODPC_SFTP_PORT: "22"
          ODPC_SFTP_USER: ${{ secrets.ODPC_SFTP_USER }}
          ODPC_SFTP_PASSWORD: ${{ secrets.ODPC_SFTP_PASSWORD }}
          ODPC_SFTP_HOSTKEY_SHA256: ${{ secrets.ODPC_SFTP_HOSTKEY_SHA256 }}
          ODPC_THEME_PATH: ${{ secrets.ODPC_THEME_PATH }}
          AI_ODPC_THEME_PATH: ${{ secrets.AI_ODPC_THEME_PATH }}
        run: python scripts/check_wordpress_sftp.py
