name: Speechable Eva live acceptance
on:
  push:
    paths: ['.github/workflows/speechable-eva-live-acceptance.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - run: python3 -m pip install 'playwright>=1.50,<2'
      - run: python3 -m playwright install --with-deps chromium
      - name: Verify live playback and stop
        run: |
          python3 - <<'PY'
          import json,time
          from playwright.sync_api import sync_playwright
          from urllib.request import urlopen,Request
          for i in range(12):
              try:
                  with urlopen(Request('https://odpc.de/?eva_live_check='+str(int(time.time())),headers={'Cache-Control':'no-cache'}),timeout=20) as r: html=r.read().decode('utf-8','replace')
                  if 'odpc_eva=20261113' in html:break
              except Exception as e:print('Waiting for live page',type(e).__name__,flush=True)
              time.sleep(10)
          else:raise SystemExit('Eva SmartGuide release not visible')
          results=[]
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=['--no-sandbox'])
              for name,url in [('home','https://odpc.de/'),('mobile-webdesign','https://odpc.de/webdesign/')]:
                  context=browser.new_context(viewport={'width':393,'height':852} if name.startswith('mobile') else {'width':1280,'height':800},is_mobile=name.startswith('mobile'),has_touch=name.startswith('mobile'))
                  page=context.new_page()
                  page.add_init_script("""window.__lastAudio=null;const oldPlay=HTMLMediaElement.prototype.play;HTMLMediaElement.prototype.play=function(){window.__lastAudio=this;return oldPlay.call(this)};""")
                  errors=[]
                  page.on('pageerror',lambda error:errors.append(str(error)))
                  try:
                      page.goto(url,wait_until='domcontentloaded',timeout=60000)
                      play=page.locator('#odpc-reader-play');play.wait_for(state='visible');play.click()
                      page.wait_for_function("['eva-playing','fallback'].includes(document.querySelector('#odpc-reader-play')?.dataset.voiceState)",timeout=110000)
                      state=play.get_attribute('data-voice-state')
                      page.wait_for_timeout(1300)
                      played=page.evaluate('window.__lastAudio ? window.__lastAudio.currentTime : 0')
                      page.locator('#odpc-reader-stop').click()
                      page.wait_for_function("!document.querySelector('#odpc-reader-play')?.dataset.voiceState",timeout=10000)
                      result={'page':name,'state':state,'played_seconds':played,'stop':'ok','errors':errors[:3]}
                      if state!='eva-playing' or played<=0:raise RuntimeError(json.dumps(result))
                      results.append(result)
                  finally:context.close()
              browser.close()
          print('LIVE EVA ACCEPTANCE',json.dumps(results,ensure_ascii=False),flush=True)
          PY
