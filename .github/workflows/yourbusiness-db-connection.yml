name: YourBusiness / database connection test
on:
  push:
    paths:
      - .github/workflows/yourbusiness-db-connection.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: yourbusiness-serialized-operations
  cancel-in-progress: false
jobs:
  db-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      MYSQL_PWD: ${{ secrets.YOURBUSINESS_DB_PASSWORD }}
    steps:
      - name: Check secret availability
        shell: bash
        run: |
          if [[ -z "$MYSQL_PWD" ]]; then
            echo "::error::YOURBUSINESS_DB_PASSWORD is missing or empty"
            exit 1
          fi
          echo "Database secret available"
      - name: Test database authentication and privileges without modifications
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq default-mysql-client >/dev/null
          timeout 25 mysql --protocol=TCP --connect-timeout=12 -h db5021889395.hosting-data.io -P 3306 -u dbu4322131             -D dbs16333569 --batch --skip-column-names             -e "SELECT 'DATABASE_CONNECTION_OK', DATABASE(), CURRENT_USER(); SHOW TABLES;"             | sed -E 's/^(.{150}).*/\1.../'
          echo "Read-only connection test completed"
