name: Bahnhof Grenzau / Guarded start-page deployment
on:
  push:
    paths:
      - 'site-deploy/bahnhof-grenzau/**'
      - 'scripts/deploy_bahnhof_grenzau_bootstrap.py'
      - '.github/workflows/bahnhof-grenzau-bootstrap.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bahnhof-grenzau-bootstrap
  cancel-in-progress: false
jobs:
  bootstrap:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[search-completion]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate PHP and Python
        run: |
          php -l site-deploy/bahnhof-grenzau/install-wordpress.php
          php -l site-deploy/bahnhof-grenzau/theme/front-page.php
          php -l site-deploy/bahnhof-grenzau/theme/index.php
          python3 -m py_compile scripts/deploy_bahnhof_grenzau_bootstrap.py
      - name: Install SFTP client
        run: python3 -m pip install 'paramiko>=3.4,<5'
      - name: Publish start page with backup and HTTP verification
        env:
          ODPC_SFTP_PASSWORD: ${{ secrets.ODPC_SFTP_PASSWORD }}
        run: python3 scripts/deploy_bahnhof_grenzau_bootstrap.py
