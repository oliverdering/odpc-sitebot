name: ODPC orchestra readability release
on:
  push:
    branches: ['work/orchestra-readability-20261114']
    paths: ['.github/workflows/odpc-orchestra-readable-release.yml']
permissions:
  contents: read
concurrency:
  group: odpc-orchestra-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify tested source
        run: |
          test "$(git rev-parse HEAD:mission-control-readable/index.html)" = "c9f049ff753f3055bf8fb283d9a8c1e3bcfaad78"
          python3 -m py_compile mission-control-readable/deploy.py
      - run: python3 -m pip install 'paramiko>=3.4,<5'
      - name: Deploy one page with backup and verification
        env:
          ODPC_SFTP_PASSWORD: ${{ secrets.ODPC_SFTP_PASSWORD }}
          AI_ODPC_THEME_PATH: ${{ secrets.AI_ODPC_THEME_PATH }}
        run: python3 -m mission-control-readable.deploy
      - name: Preserve previous version
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orchestra-readable-previous
          path: orchestra-readable-backup/
          retention-days: 15
          if-no-files-found: ignore
