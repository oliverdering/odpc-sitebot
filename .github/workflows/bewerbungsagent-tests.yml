name: Bewerbungsagent unit tests
on:
  push:
    paths:
      - 'bewerbungsagent/**'
      - '.github/workflows/bewerbungsagent-tests.yml'
  pull_request:
    paths:
      - 'bewerbungsagent/**'
      - '.github/workflows/bewerbungsagent-tests.yml'
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run ATS tests
        run: cd bewerbungsagent && python -m unittest discover -p 'test_*.py' -v
