name: Orchestra FAQ live verification
on:
  push:
    branches: ['work/orchestra-faq-20261114']
    paths: ['.github/workflows/orchestra-faq-live.yml']
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: node mission-control-faq/live-test.cjs
