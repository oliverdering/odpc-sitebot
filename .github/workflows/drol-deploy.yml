name: D.R.O.L. / Isolated website deploy
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site-deploy/drol.odpc.de/**'
      - 'scripts/deploy_drol.py'
      - '.github/workflows/drol-deploy.yml'
permissions:
  contents: read
concurrency:
  group: drol-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate homepage and deploy script
        run: |
          python3 -m py_compile scripts/deploy_drol.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('site-deploy/drol.odpc.de/index.html').read_text()
          assert 'Wir machen Ihre Drohnendaten nutzbar.' in p
          assert 'https://odpc.de/wp-content/uploads/2026/10/' in p
          assert 'mission-control.html' in p
          mission=Path('site-deploy/drol.odpc.de/mission-control.html').read_text()
          assert 'DEINE DROHNE. DEINE MÖGLICHKEITEN.' in mission
          assert 'data/models-db.json' in mission
          PY
      - run: python3 -m pip install 'paramiko>=3.4,<5'
      - name: Deploy only /drol
        env:
          ODPC_SFTP_PASSWORD: ${{ secrets.ODPC_SFTP_PASSWORD }}
        run: python3 scripts/deploy_drol.py
      - name: Verify public release and dynamic feed
        run: |
          python3 - <<'PY'
          import json, time
          from urllib.request import urlopen, Request
          checks = {
              "https://drol.odpc.de/mission-control.html": b"DEINE DROHNE. DEINE M",
              "https://drol.odpc.de/data/events.json": b'"events"',
          }
          for url, expected in checks.items():
              for attempt in range(6):
                  try:
                      with urlopen(Request(url, headers={"Cache-Control":"no-cache"}), timeout=15) as response:
                          body=response.read(300000)
                      if expected not in body:
                          raise RuntimeError("Expected release marker missing")
                      if url.endswith(".json"):
                          payload=json.loads(body)
                          assert payload["schema_version"] == 1 and isinstance(payload["events"],list)
                      print("PASS public release:", url)
                      break
                  except Exception as exc:
                      if attempt == 5:
                          raise RuntimeError("Public release verification failed: "+url) from exc
                      time.sleep(10)
          PY
