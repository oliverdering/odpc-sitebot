name: ODPC Webdesign and Auto Monkey comparison QA
on:
  push:
    paths:
      - 'scripts/odpc-webdesign-automonkey-qa.mjs'
      - '.github/workflows/odpc-webdesign-automonkey-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify both live pages, 3-step colors, assets, links and mobile viewport
        run: node scripts/odpc-webdesign-automonkey-qa.mjs
