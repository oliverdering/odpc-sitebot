name: Kanzlei Justen / WordPress REST access check
on:
  push:
    paths:
      - '.github/workflows/kanzlei-justen-wp-rest-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify public WordPress API and optional authenticated admin access
        env:
          JUSTEN_WP_USERNAME: ${{ secrets.JUSTEN_WP_USERNAME }}
          JUSTEN_WP_APP_PASSWORD: ${{ secrets.JUSTEN_WP_APP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os,urllib.request,urllib.error,base64,json
          base='https://ra-justen.de'
          def get(path,headers=None):
              req=urllib.request.Request(base+path,headers=headers or {'User-Agent':'ODPC-Justen-REST-Check/1.0'})
              with urllib.request.urlopen(req,timeout=25) as r:return r.status,json.load(r)
          status,data=get('/wp-json/')
          print('PUBLIC REST:',status,'name:',data.get('name','unknown'))
          user=os.environ.get('JUSTEN_WP_USERNAME','')
          password=os.environ.get('JUSTEN_WP_APP_PASSWORD','')
          if not user or not password:
              print('AUTH NOT CONFIGURED: add JUSTEN_WP_USERNAME and JUSTEN_WP_APP_PASSWORD as GitHub Actions secrets')
              raise SystemExit(2)
          token=base64.b64encode((user+':'+password).encode()).decode()
          status,data=get('/wp-json/wp/v2/users/me?context=edit',{'Authorization':'Basic '+token,'User-Agent':'ODPC-Justen-REST-Check/1.0'})
          caps=data.get('capabilities',{})
          if not caps.get('administrator') and not caps.get('manage_options'):
              raise SystemExit('Authenticated user lacks administrator permissions')
          print('PASS: authenticated WordPress administrator REST access:',data.get('id'))
          PY
