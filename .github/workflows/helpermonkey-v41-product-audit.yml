name: Helper Monkey V4.1 / Product and FAQ Audit
on:
  push:
    paths:
      - 'scripts/qa_helpermonkey_v41_products.py'
      - 'downloads/**'
      - '.github/workflows/helpermonkey-v41-product-audit.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * *'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify audit script syntax
        run: python3 -m py_compile scripts/qa_helpermonkey_v41_products.py
      - name: Audit live pages, FAQ and ZIP integrity
        run: python3 scripts/qa_helpermonkey_v41_products.py
      - name: Publish visible audit report
        if: always()
        run: |
          if test -f helpermonkey-v41-audit.md; then cat helpermonkey-v41-audit.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Store audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: helpermonkey-v41-audit
          path: helpermonkey-v41-audit.md
          if-no-files-found: ignore
          retention-days: 30
