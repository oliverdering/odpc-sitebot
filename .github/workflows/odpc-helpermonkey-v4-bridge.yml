name: ODPC / Helper Monkey V4 Cross-Site Bridge
on:
  push:
    paths:
      - 'site-deploy/odpc.de/odpc-helpermonkey-v4-bridge.php'
      - 'scripts/deploy_odpc_helpermonkey_v4_bridge.py'
      - '.github/workflows/odpc-helpermonkey-v4-bridge.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: odpc-helpermonkey-v4-bridge
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Verify PHP and deployment script
        run: |
          php -l site-deploy/odpc.de/odpc-helpermonkey-v4-bridge.php
          grep -q 'id="odpc-reader-test"' site-deploy/odpc.de/odpc-helpermonkey-v4-bridge.php
          grep -q 'id="odpc-unified-dock-js"' site-deploy/odpc.de/odpc-helpermonkey-v4-bridge.php
          grep -q 'id="odpc-reader-mic"' site-deploy/odpc.de/odpc-helpermonkey-v4-bridge.php
          ! grep -q 'odpc-voice/v1' site-deploy/odpc.de/odpc-helpermonkey-v4-bridge.php
          python3 -m py_compile scripts/deploy_odpc_helpermonkey_v4_bridge.py
          python3 - <<'PY'
          from pathlib import Path
          import re,subprocess,tempfile
          src=Path('site-deploy/odpc.de/odpc-helpermonkey-v4-bridge.php').read_text()
          blocks=re.findall(r'<script[^>]*>(.*?)</script>',src,re.S|re.I)
          assert blocks,'No inline JavaScript found'
          for i,block in enumerate(blocks):
              with tempfile.NamedTemporaryFile(mode='w',suffix='.js') as tmp:
                  tmp.write(block);tmp.flush()
                  subprocess.run(['node','--check',tmp.name],check=True)
          print('PASS:',len(blocks),'inline JavaScript blocks syntax checked')
          PY
      - name: Install SFTP dependency
        run: python3 -m pip install 'paramiko>=3.4,<5'
      - name: Deploy with atomic backup and live smoke test
        env:
          ODPC_SFTP_PASSWORD: ${{ secrets.ODPC_SFTP_PASSWORD }}
        run: python3 scripts/deploy_odpc_helpermonkey_v4_bridge.py
      - name: Verify public HTML on normal and uncached URLs
        shell: bash
        run: |
          python3 - <<'PY'
          from urllib.request import Request,urlopen
          from urllib.parse import urlencode
          import time
          for label,url in [('normal','https://odpc.de/'),('uncached','https://odpc.de/?'+urlencode({'odpc_voice_check':str(int(time.time()))}))]:
              try:
                  with urlopen(Request(url,headers={'User-Agent':'ODPC Voice Release Verification','Cache-Control':'no-cache'}),timeout=25) as response:
                      html=response.read(800000).decode('utf-8','replace')
                  missing=[marker for marker in ('id="odpc-reader-play"','id="odpc-reader-mic"','id="odpc-reader-test"','id="odpc-unified-dock-js"') if marker not in html]
                  print(label,'HTML bytes:',len(html),'missing:',missing,flush=True)
                  if missing and label=='uncached':raise SystemExit('FAIL: current deployment missing on uncached site')
                  if missing:print('WARNING: canonical homepage serves stale cached HTML; requires page cache purge',flush=True)
              except Exception as exc:
                  print(label,'verification error:',str(exc),flush=True)
                  print('WARNING: public HTTP verification unavailable; SFTP SHA256 verification remains authoritative for upload integrity',flush=True)
          PY
      - name: Audit ODPC pages and subdomains without modifying them
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          from urllib.request import Request,urlopen
          from urllib.error import URLError,HTTPError
          from urllib.parse import urlencode
          import time
          sites={
            'odpc.de home':'https://odpc.de/',
            'odpc.de article':'https://odpc.de/prompt-engineering-digitale-mitarbeiter-ki-sinnvoll-nutzen/',
            'Helper Monkey':'https://ai.odpc.de/',
            'DROL':'https://drol.odpc.de/',
            'Tante Lenchen':'https://tante-lenchen.odpc.de/'
          }
          print('ODPC CROSS-SITE AUDIT (read-only; absence is NOT deployment success)',flush=True)
          for label,url in sites.items():
              try:
                  req=Request(url+('?' if '?' not in url else '&')+urlencode({'odpc_audit':str(int(time.time()))}),headers={'User-Agent':'ODPC-Cross-Site-Audit/1.0','Cache-Control':'no-cache'})
                  with urlopen(req,timeout=12) as response:
                      html=response.read(1000000).decode('utf-8','replace')
                  markers={name:marker in html for name,marker in {
                    'dock_initializer':"dock.id='odpc-utility-dock'",
                    'dock_script':'id="odpc-unified-dock-js"',
                    'language':'gt_float_switcher',
                    'reader':'id="odpc-reader-play"',
                    'stop':'id="odpc-reader-stop"',
                    'whatsapp':'WhatsApp'
                  }.items()}
                  print(label,'HTTP OK',markers,flush=True)
                  if not markers['dock_script']:print('WARNING:',label,'has no shared ODPC dock script',flush=True)
                  if markers['dock_script'] and not markers['dock_initializer']:print('WARNING:',label,'dock initializer not found',flush=True)
              except (URLError,HTTPError,TimeoutError) as exc:
                  print('WARNING:',label,'HTTP unavailable:',type(exc).__name__,str(exc),flush=True)
          PY
      - name: Diagnose canonical homepage cache and response identity
        if: success()
        run: |
          python3 - <<'PY'
          from urllib.request import Request,urlopen
          from urllib.parse import urlencode
          import time,hashlib,re,json
          urls={'canonical':'https://odpc.de/','cache-bypass':'https://odpc.de/?'+urlencode({'odpc_diagnostic':str(int(time.time()))})}
          report={}
          for name,url in urls.items():
              for attempt in range(2):
                  try:
                      with urlopen(Request(url,headers={'User-Agent':'ODPC-Diagnostic/1.0','Cache-Control':'no-cache','Pragma':'no-cache'}),timeout=30) as resp:
                          html=resp.read(900000)
                          headers={k:v for k,v in resp.headers.items() if k.lower() in ('cache-control','age','etag','last-modified','expires','server','via','x-cache','x-cache-status','x-litespeed-cache','cf-cache-status','vary','content-type','x-wpfc-cache','x-wpfc-cache-status')}
                          report[name]={'status':resp.status,'final_url':resp.url,'bytes':len(html),'sha256':hashlib.sha256(html).hexdigest(),'has_bridge':b'id="odpc-unified-dock-js"' in html,'has_reader':b'id="odpc-reader-play"' in html,'headers':headers,'html_comments':re.findall(r'<!--[^>]{0,250}(?:cache|WP Fastest|optimize)[^>]{0,250}-->',html.decode('utf-8','replace'),re.I)[-8:]}
                      break
                  except Exception as e:
                      report[name]={'error':str(e)}
          print('CANONICAL CACHE DIAGNOSTIC',json.dumps(report,ensure_ascii=False,indent=2),flush=True)
          PY
      - name: Install mobile browser for visual acceptance test
        if: success()
        run: |
          python3 -m pip install 'playwright>=1.50,<2'
          python3 -m playwright install chromium
      - name: Verify real mobile toolbar geometry and controls
        if: success()
        shell: bash
        run: |
          mkdir -p odpc-mobile-qa
          python3 - <<'PY'
          import json,time
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          results=[]
          urls=[
            ('homepage-canonical','https://odpc.de/'),
            ('homepage-uncached','https://odpc.de/?odpc_mobile_qa='+str(int(time.time()))),
            ('article','https://odpc.de/prompt-engineering-digitale-mitarbeiter-ki-sinnvoll-nutzen/?odpc_mobile_qa='+str(int(time.time()))),
            ('helper-monkey','https://ai.odpc.de/'),
            ('drol','https://drol.odpc.de/'),
            ('tante-lenchen','https://tante-lenchen.odpc.de/')
          ]
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=['--no-sandbox'])
              for name,url in urls:
                  page=browser.new_page(viewport={'width':393,'height':852},device_scale_factor=2,is_mobile=True,has_touch=True)
                  item={'page':name,'url':url}
                  try:
                      page.goto(url,wait_until='domcontentloaded',timeout=30000)
                      page.wait_for_timeout(4500)
                      item.update(page.evaluate("""() => {
                        const dock=document.getElementById('odpc-utility-dock');
                        const flag=document.querySelector('#odpc-utility-dock .odpc-dock-language .gt_float_switcher, #odpc-utility-dock .odpc-dock-language #gt_float_wrapper, #odpc-utility-dock .odpc-dock-language .gtranslate_wrapper');
                        const play=document.getElementById('odpc-reader-play');
                        const stop=document.getElementById('odpc-reader-stop');
                        const wa=dock?.querySelector('a[href*="wa.me"],a[href*="whatsapp"],.odpc-wa-sticky,.odpc-hm-v4-wa,#odpc-hm-v4-wa');
                        const rect=e=>{if(!e)return null;const r=e.getBoundingClientRect();return {left:r.left,right:r.right,top:r.top,bottom:r.bottom,width:r.width,height:r.height,visible:getComputedStyle(e).display!=='none'&&getComputedStyle(e).visibility!=='hidden'&&r.width>0&&r.height>0}};
                        return {dock:rect(dock),flag:rect(flag),play:rect(play),stop:rect(stop),whatsapp:rect(wa),whatsapp_href:wa?.getAttribute('href')||null};
                      }"""))
                      d=item.get('dock');items=[item.get(k) for k in ('flag','play','stop','whatsapp')]
                      item['pass']=bool(d and d['visible'] and all(x and x['visible'] and x['left']>=d['left']-4 and x['right']<=d['right']+4 and x['top']>=d['top']-8 and x['bottom']<=d['bottom']+8 for x in items) and item.get('whatsapp_href'))
                      item['reason']='all required controls inside dock' if item['pass'] else 'missing dock/control, wrong position, or WhatsApp link'
                  except Exception as e:
                      item['pass']=False;item['error']=str(e)
                  finally:
                      page.screenshot(path='odpc-mobile-qa/'+name+'.png',full_page=True,timeout=15000)
                      page.close()
                  results.append(item)
              browser.close()
          Path('odpc-mobile-qa/report.json').write_text(json.dumps(results,indent=2,ensure_ascii=False))
          print(json.dumps(results,indent=2,ensure_ascii=False),flush=True)
          if not all(x['pass'] for x in results):raise SystemExit('MOBILE QA FAILED: screenshot and geometry evidence saved')
          PY
      - name: Save mobile QA screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odpc-mobile-qa
          path: odpc-mobile-qa/
          if-no-files-found: ignore
          retention-days: 7
      - name: Save prior module
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odpc-v4-bridge-previous-file
          path: backup-odpc-v4-bridge/
          if-no-files-found: ignore
          retention-days: 15
