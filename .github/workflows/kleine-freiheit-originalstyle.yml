name: Kleine Freiheit / original style and gallery
on:
  push:
    branches: [feature/kleine-freiheit-demo-20261113]
    paths: ['.github/workflows/kleine-freiheit-originalstyle.yml']
permissions:
  contents: read
concurrency:
  group: yourbusiness-serialized-operations
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish WordPress style and approved gallery
        env:
          SSHPASS: ${{ secrets.ODPC_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          php -l yourbusiness/kleine-freiheit-demo/kleine-freiheit.php
          test -n "$SSHPASS"
          sudo apt-get install -y -qq sshpass >/dev/null
          mkdir -p ~/.ssh
          ssh-keyscan -4 -t ed25519 home119567219.1and1-data.host > ~/.ssh/known_hosts 2>/dev/null
          ssh-keygen -lf ~/.ssh/known_hosts | grep -F 'SHA256:1gx2w8Rtv3wCgi7Jh8myf/KVd72cRQbow03UP8P095Q' >/dev/null
          opts="-4 -o StrictHostKeyChecking=yes -o PreferredAuthentications=password -o PubkeyAuthentication=no -o NumberOfPasswordPrompts=1 -o ConnectTimeout=20"
          host="p37641258@home119567219.1and1-data.host"
          old_hash=$(git show 7deda82a1daa236161ee12e958fd61ebbec115b3:yourbusiness/kleine-freiheit-demo/kleine-freiheit.php | sha256sum | cut -d " " -f1)
          remote_hash=$(sshpass -e ssh $opts "$host" 'sha256sum YourBusiness/wp-content/plugins/odpc-kleine-freiheit/kleine-freiheit.php' | cut -d " " -f1)
          test "$old_hash" = "$remote_hash" || { echo "Live plugin changed; refusing overwrite"; exit 1; }
          cd yourbusiness/kleine-freiheit-demo/assets
          files=(01-1000434338.jpg 02-1000434337.jpg 03-1000434336.jpg 04-1000434335.jpg 05-1000434334.jpg 06-1000434333.jpg 07-1000434332.jpg 08-1000434331.jpg 09-1000434330.jpg kleine-freiheit-wordmark.png)
          sshpass -e scp $opts "${files[@]}" "$host:YourBusiness/wp-content/plugins/odpc-kleine-freiheit/assets/"
          sha256sum "${files[@]}" > /tmp/kf-local-hashes
          sshpass -e ssh $opts "$host" 'cd YourBusiness/wp-content/plugins/odpc-kleine-freiheit/assets && sha256sum 01-1000434338.jpg 02-1000434337.jpg 03-1000434336.jpg 04-1000434335.jpg 05-1000434334.jpg 06-1000434333.jpg 07-1000434332.jpg 08-1000434331.jpg 09-1000434330.jpg kleine-freiheit-wordmark.png' > /tmp/kf-remote-hashes
          diff -u /tmp/kf-local-hashes /tmp/kf-remote-hashes
          cd ..
          sshpass -e scp $opts kleine-freiheit.php "$host:YourBusiness/wp-content/plugins/odpc-kleine-freiheit/kleine-freiheit.php.new"
          local_hash=$(sha256sum kleine-freiheit.php | cut -d " " -f1)
          remote_hash=$(sshpass -e ssh $opts "$host" 'sha256sum YourBusiness/wp-content/plugins/odpc-kleine-freiheit/kleine-freiheit.php.new' | cut -d " " -f1)
          test "$local_hash" = "$remote_hash"
          sshpass -e ssh $opts "$host" 'mv YourBusiness/wp-content/plugins/odpc-kleine-freiheit/kleine-freiheit.php.new YourBusiness/wp-content/plugins/odpc-kleine-freiheit/kleine-freiheit.php'
      - name: Verify site and gallery
        run: |
          set -euo pipefail
          curl -fsSL --max-time 30 'https://yourbusiness.odpc.de/?pagename=kleine-freiheit' -o /tmp/kf-live
          grep -q 'kleine-freiheit-wordmark.png' /tmp/kf-live
          grep -q '1000434330.jpg' /tmp/kf-live
          curl -fsSL --max-time 30 -o /dev/null 'https://yourbusiness.odpc.de/wp-content/plugins/odpc-kleine-freiheit/assets/kleine-freiheit-wordmark.png'
          echo KLEINE_FREIHEIT_ORIGINAL_STYLE_LIVE
