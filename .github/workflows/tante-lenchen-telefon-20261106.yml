name: Tante Lenchen Telefonnummer
on:
  push:
    paths:
      - '.github/workflows/tante-lenchen-telefon-20261106.yml'
permissions:
  contents: read
jobs:
  phone:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install 'paramiko>=3.4,<5'
      - name: Correct phone in theme
        env:
          ODPC_SFTP_PASSWORD: ${{ secrets.ODPC_SFTP_PASSWORD }}
        run: python3 scripts/tante_lenchen_fix_phone_20261106.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tante-lenchen-before-phone
          path: phone-before.zip
          if-no-files-found: ignore
