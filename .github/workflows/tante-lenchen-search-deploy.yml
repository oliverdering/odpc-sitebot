name: Tante Lenchen / Local search metadata
on:
  push:
    paths:
      - 'site-deploy/tante-lenchen.odpc.de/odpc-local-search.php'
      - 'scripts/deploy_lenchen_search.py'
      - '.github/workflows/tante-lenchen-search-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tante-lenchen-search-metadata
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate source
        run: |
          php -l site-deploy/tante-lenchen.odpc.de/odpc-local-search.php
          python3 -m py_compile scripts/deploy_lenchen_search.py
      - name: Install SFTP client
        run: python3 -m pip install 'paramiko>=3.4,<5'
      - name: Publish and verify all nine public pages
        env:
          ODPC_SFTP_PASSWORD: ${{ secrets.ODPC_SFTP_PASSWORD }}
        run: python3 scripts/deploy_lenchen_search.py
      - name: Preserve previous module
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: previous-lenchen-search-metadata
          path: backup-lenchen-search/
          if-no-files-found: ignore
          retention-days: 15
