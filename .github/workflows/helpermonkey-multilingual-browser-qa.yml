name: Helper Monkey / Multilingual browser QA
on:
  push:
    paths:
      - 'scripts/helpermonkey_multilingual_browser_qa.mjs'
      - '.github/workflows/helpermonkey-multilingual-browser-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-site-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tools
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Test real language selection, clipboard and public ZIP downloads
        run: node scripts/helpermonkey_multilingual_browser_qa.mjs
