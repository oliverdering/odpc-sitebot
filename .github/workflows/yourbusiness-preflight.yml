name: YourBusiness / read-only infrastructure preflight
on:
  push:
    paths:
      - '.github/workflows/yourbusiness-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: yourbusiness-serialized-operations
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Install SFTP library
        run: python -m pip install 'paramiko>=3.4,<5'
      - name: Verify SFTP access and inspect target without changes
        env:
          SFTP_HOST: ${{ secrets.ODPC_SFTP_HOST || 'home119567219.1and1-data.host' }}
          SFTP_USER: ${{ secrets.ODPC_SFTP_USER || 'acc1461323326' }}
          SFTP_PASSWORD: ${{ secrets.ODPC_SFTP_PASSWORD }}
          SFTP_FINGERPRINT: ${{ secrets.ODPC_SFTP_HOSTKEY_SHA256 || 'SHA256:1gx2w8Rtv3wCgi7Jh8myf/KVd72cRQbow03UP8P095Q' }}
        run: |
          python - <<'PY'
          import os, base64, hashlib, stat, socket, paramiko
          host=os.environ['SFTP_HOST']; user=os.environ['SFTP_USER']
          password=os.environ.get('SFTP_PASSWORD','')
          if not password: raise SystemExit('SFTP secret missing')
          sock=socket.create_connection((host,22),timeout=15)
          transport=paramiko.Transport(sock)
          transport.start_client(timeout=20)
          fingerprint='SHA256:'+base64.b64encode(hashlib.sha256(transport.get_remote_server_key().asbytes()).digest()).decode().rstrip('=')
          if fingerprint != os.environ['SFTP_FINGERPRINT']:
              transport.close(); raise SystemExit('SFTP host key mismatch; refusing connection')
          transport.auth_password(user,password)
          sftp=paramiko.SFTPClient.from_transport(transport)
          print('Authenticated SFTP connection: OK')
          for path in ['/YourBusiness','YourBusiness']:
              try:
                  info=sftp.stat(path)
                  if not stat.S_ISDIR(info.st_mode):
                      print('Target exists but is not a directory:',path); continue
                  entries=sftp.listdir(path)
                  print('Target directory accessible:',path,'entry count:',len(entries))
                  print('Top-level entries:', ', '.join(sorted(entries)[:60]))
                  print('WordPress core directories present:',all(x in entries for x in ['wp-admin','wp-includes','wp-content']))
                  print('wp-config.php present:', 'wp-config.php' in entries)
                  print('wp-config-sample.php present:', 'wp-config-sample.php' in entries)
                  for sub in ['wp-content/plugins','wp-content/themes','wp-content/uploads']:
                      try:
                          names=sftp.listdir(path+'/'+sub)
                          print(sub, 'entry count:',len(names),'names:', ', '.join(sorted(names)[:25]))
                      except IOError:
                          print(sub,'not accessible')
                  print('Database configuration values and file contents are deliberately not read or printed.')
                  break
              except IOError:
                  print('Target path not accessible:',path)
          else:
              raise SystemExit('Target directory not found; no changes made')
          sftp.close(); transport.close()
          PY
      - name: Verify HTTPS endpoint
        run: |
          curl --silent --show-error --location --max-time 20 --output /dev/null --write-out 'HTTPS status: %{http_code}; final URL: %{url_effective}\n' https://yourbusiness.odpc.de/
