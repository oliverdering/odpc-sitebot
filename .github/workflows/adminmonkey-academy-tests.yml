name: AdminMonkey Academy Regression Tests

on:
  push:
    branches: [main]
    paths:
      - 'adminmonkey/academy/competency_bank.json'
      - 'adminmonkey/academy/evaluate_responses.py'
      - 'adminmonkey/academy/test_evaluate_responses.py'
      - 'adminmonkey/academy/run_competency_engine.py'
      - 'adminmonkey/academy/test_run_competency_engine.py'
      - '.github/workflows/adminmonkey-competency-engine.yml'
      - 'adminmonkey/academy/test_certification_evidence.py'
      - 'adminmonkey/knowledge/certification_competency.py'
      - '.github/workflows/adminmonkey-academy-tests.yml'
  pull_request:
    paths:
      - 'adminmonkey/academy/competency_bank.json'
      - 'adminmonkey/academy/evaluate_responses.py'
      - 'adminmonkey/academy/test_evaluate_responses.py'
      - 'adminmonkey/academy/run_competency_engine.py'
      - 'adminmonkey/academy/test_run_competency_engine.py'
      - '.github/workflows/adminmonkey-competency-engine.yml'
      - 'adminmonkey/academy/test_certification_evidence.py'
      - 'adminmonkey/knowledge/certification_competency.py'
      - '.github/workflows/adminmonkey-academy-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluator-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run competency screening regression tests
        run: python -m unittest discover -s adminmonkey/academy -p 'test_*.py' -v
      - name: Validate actual competency bank schema
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          bank = json.loads(Path('adminmonkey/academy/competency_bank.json').read_text(encoding='utf-8'))
          assert bank.get('scenarios'), 'No competency scenarios'
          ids = [scenario['id'] for scenario in bank['scenarios']]
          assert len(ids) == len(set(ids)), 'Duplicate scenario IDs'
          assert len(ids) >= 21, 'Scenario bank unexpectedly shrunk'
          for scenario in bank['scenarios']:
              assert scenario.get('id') and scenario.get('track'), 'Scenario lacks ID or track'
              assert isinstance(scenario.get('required'), list) and scenario['required'], 'Missing required rubric'
              assert isinstance(scenario.get('unsafe'), list), 'Missing unsafe rubric'
              assert all(isinstance(t, str) and t.strip() for t in scenario['required']), 'Empty required keyword'
              assert all(isinstance(t, str) and t.strip() for t in scenario['unsafe']), 'Empty unsafe keyword'
          print(f"Validated {len(bank['scenarios'])} practice scenarios; not a certification score")
          PY
