name: Speechable Piper isolated browser diagnostic
on:
  push:
    paths:
      - '.github/workflows/speechable-piper-browser-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  piper-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - run: python3 -m pip install 'playwright>=1.50,<2'
      - run: python3 -m playwright install --with-deps chromium
      - name: Exercise actual Piper voice in browser
        run: |
          python3 - <<'PY'
          import json, pathlib
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=['--no-sandbox'])
              page=browser.new_page()
              page.set_default_timeout(180000)
              page.goto('https://odpc.de/',wait_until='domcontentloaded',timeout=60000)
              result=page.evaluate("""async () => {
                const report={};
                try {
                  const tts=await import('https://cdn.jsdelivr.net/npm/@mintplex-labs/piper-tts-web@1.0.4/+esm');
                  const voiceId='de_DE-eva_k-x_low';
                  for (const [name,text] of [['short','Hallo, hier spricht Eva. Willkommen bei ODPC.'],['homepage',(document.querySelector('main')?.innerText||'').slice(0,1200)]]) {
                    try {
                      const blob=await tts.predict({text,voiceId});
                      const bytes=await blob.arrayBuffer();
                      const ctx=new AudioContext();const audio=await ctx.decodeAudioData(bytes.slice(0));
                      let peak=0;for(const x of audio.getChannelData(0))peak=Math.max(peak,Math.abs(x));
                      report[name]={ok:audio.duration>0&&peak>0,bytes:bytes.byteLength,duration:audio.duration,peak};
                      await ctx.close();
                    } catch(e) { report[name]={ok:false,error:String(e?.stack||e)}; }
                  }
                } catch(e) { report.setupError=String(e?.stack||e); }
                return report;
              }""")
              print('PIPER REPORT',json.dumps(result,ensure_ascii=False),flush=True)
              browser.close()
              if not result.get('short',{}).get('ok') or not result.get('homepage',{}).get('ok'):
                  raise SystemExit('Piper generation failed or could not be tested')
          PY
