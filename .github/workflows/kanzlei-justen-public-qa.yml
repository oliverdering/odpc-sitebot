name: Kanzlei Justen / Public Security and Function QA
on:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * *'
permissions:
  contents: read
jobs:
  public-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check public routes, headers and key content
        shell: bash
        run: |
          set -euo pipefail
          for path in / /impressum/ /datenschutz/; do
            echo "::group::https://ra-justen.de${path}"
            curl --fail --location --silent --show-error --max-time 25 -D headers.txt -o page.html "https://ra-justen.de${path}"
            python3 - <<'PY'
          import pathlib
          h=pathlib.Path('headers.txt').read_text(errors='replace')
          p=pathlib.Path('page.html').read_text(errors='replace')
          assert '<html' in p.lower(), 'HTML missing'
          assert 'Anne-Kathrin Justen' in p, 'Kanzlei name missing'
          print('HTML delivered; bytes:',len(p))
          for key in ('strict-transport-security','content-security-policy','x-content-type-options','referrer-policy','x-frame-options'):
              lines=[line.strip() for line in h.splitlines() if line.lower().startswith(key+':')]
              print(key+':',lines[-1] if lines else 'MISSING (review)')
          PY
            echo "::endgroup::"
          done
      - name: Check homepage critical navigation and contacts
        shell: bash
        run: |
          curl --fail --location --silent --show-error --max-time 25 https://ra-justen.de/ -o page.html
          python3 - <<'PY'
          from pathlib import Path
          s=Path('page.html').read_text(errors='replace')
          for name,fragment in {
              'impressum':'/impressum/',
              'datenschutz':'/datenschutz/',
              'phone':'tel:+4965199897336',
              'email':'mailto:kanzlei@ra-justen.de',
              'booking':'appointment-request',
              'privacy warning':'vertraulichen',
          }.items():
              ok=fragment in s
              print(('PASS' if ok else 'FAIL')+': '+name)
              if not ok: raise SystemExit(1)
          PY
