name: ODPC / one.eye chronology release
on:
  pull_request:
    branches: [main]
    paths:
      - 'site-deploy/odpc.de/odpc-oneeye-chronik.php'
      - 'scripts/deploy_oneeye_chronik.py'
      - '.github/workflows/oneeye-chronik-deploy.yml'
  push:
    branches: [main]
    paths:
      - 'site-deploy/odpc.de/odpc-oneeye-chronik.php'
      - 'scripts/deploy_oneeye_chronik.py'
      - '.github/workflows/oneeye-chronik-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: odpc-oneeye-chronik-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax and scope checks
        run: |
          php -l site-deploy/odpc.de/odpc-oneeye-chronik.php
          python -m py_compile scripts/deploy_oneeye_chronik.py
          grep -q 'oneeye-chronik-v2' site-deploy/odpc.de/odpc-oneeye-chronik.php
      - name: Install SFTP client
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: python -m pip install 'paramiko>=3.4,<5'
      - name: Publish chronology and verify public page
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          ODPC_SFTP_PASSWORD: ${{ secrets.ODPC_SFTP_PASSWORD }}
        run: python scripts/deploy_oneeye_chronik.py
      - name: Save rollback artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odpc-oneeye-chronik-previous-file
          path: odpc-oneeye-chronik-backup/
          if-no-files-found: ignore
          retention-days: 15
