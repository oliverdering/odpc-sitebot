name: YourBusiness / Instant demo deployment
# 2026-11-14: Re-run isolated customer deployment and acceptance checks.
on:
  push:
    paths:
      - 'yourbusiness/plugin/yourbusiness-instant-demo/**'
      - 'scripts/deploy_yourbusiness_demo.py'
      - '.github/workflows/yourbusiness-demo-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: yourbusiness-serialized-operations
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Python
        run: python -m py_compile scripts/deploy_yourbusiness_demo.py
      - name: PHP syntax check before upload
        run: |
          php -l yourbusiness/plugin/yourbusiness-instant-demo/yourbusiness-instant-demo.php
          php -l yourbusiness/plugin/yourbusiness-instant-demo/discover.php
          php -l yourbusiness/plugin/yourbusiness-instant-demo/kf-gallery-admin.php
      - name: Install Paramiko
        run: python -m pip install 'paramiko>=3.4,<5'
      - name: Upload plugin to isolated WordPress
        env:
          ODPC_SFTP_PASSWORD: ${{ secrets.ODPC_SFTP_PASSWORD }}
        run: python scripts/deploy_yourbusiness_demo.py
      - name: Validate and activate demo plugin with WP-CLI
        env:
          SSHPASS: ${{ secrets.ODPC_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          sudo apt-get install -y -qq sshpass >/dev/null
          mkdir -p ~/.ssh
          ssh-keyscan -4 -t ed25519 home119567219.1and1-data.host > ~/.ssh/known_hosts 2>/dev/null
          ssh-keygen -lf ~/.ssh/known_hosts | grep -F 'SHA256:1gx2w8Rtv3wCgi7Jh8myf/KVd72cRQbow03UP8P095Q' >/dev/null
          sshpass -e ssh -4 -o BatchMode=no -o PreferredAuthentications=password -o PubkeyAuthentication=no -o NumberOfPasswordPrompts=1 -o StrictHostKeyChecking=yes -o ConnectTimeout=20 p37641258@home119567219.1and1-data.host 'set -eu
            cd "$HOME/YourBusiness"
            test -f wp-config.php
            test -f wp-content/plugins/yourbusiness-instant-demo/yourbusiness-instant-demo.php
            uiwpcli_PHP_FLAVOR=php8.3 wp core is-installed --quiet
            uiwpcli_PHP_FLAVOR=php8.3 wp plugin activate yourbusiness-instant-demo
            existing=$(uiwpcli_PHP_FLAVOR=php8.3 wp post list --post_type=page --name=sofort-demo --field=ID --format=ids)
            if [ -z "$existing" ]; then
              uiwpcli_PHP_FLAVOR=php8.3 wp post create --post_type=page --post_status=publish --post_name=sofort-demo --post_title="YourBusiness Sofort-Demo" --post_content="[yourbusiness_demo]"
            else
              echo "Demo page already exists: $existing"
            fi
            echo YOURBUSINESS_DEMO_PLUGIN_ACTIVE
          '
      - name: Triple independent HTTP and content acceptance for the three client demos
        run: |
          set -euo pipefail
          base='https://yourbusiness.odpc.de/'
          check() {
            label="$1"
            query="$2"
            selector="$3"
            company="$4"
            file="/tmp/yourbusiness-$label.html"
            status=$(curl --fail --location --silent --show-error --max-time 35 --retry 2 \
              --header 'Cache-Control: no-cache' --output "$file" --write-out '%{http_code}' "$base?$query")
            test "$status" = '200' || { echo "FAILED: $label status=$status"; return 1; }
            grep -Fq "id=\"$selector\"" "$file" || { echo "FAILED: $label missing selector $selector"; return 1; }
            grep -Fq "$company" "$file" || { echo "FAILED: $label company $company"; return 1; }
            grep -Fq 'name="robots" content="noindex' "$file" || { echo "FAILED: $label missing demo noindex"; return 1; }
            echo "PASS: $label ($company), HTTP $status"
          }
          for round in 1 2 3; do
            echo "---- independent verification round $round/3 ----"
            check "freedom-$round" 'yb_kleine_freiheit=1&design=klassisch' 'kf-demo' 'Kleine Freiheit'
            check "emins-$round" 'yb_emins_grill=1' 'em-demo' "Emin"
            check "paradies-$round" 'yb_doener_paradies=1' 'dp-demo' 'Döner Paradies'
          done
          check 'freedom-modern' 'yb_kleine_freiheit=1&design=modern' 'kf-demo' 'Kleine Freiheit'
          check 'showcase' 'yb_showcase=1' 'showcase-grid' 'Kleine Freiheit'
          grep -Fq 'Döner Paradies' /tmp/yourbusiness-showcase.html
          grep -Fq "Emin" /tmp/yourbusiness-showcase.html
          grep -Fq 'id="dp-modern"' /tmp/yourbusiness-paradies-3.html
          grep -Fq 'id="dp-lang"' /tmp/yourbusiness-paradies-3.html
          grep -Fq 'id="dp-speak"' /tmp/yourbusiness-paradies-3.html
          grep -Fq 'Drehspieß-Sandwich' /tmp/yourbusiness-paradies-3.html
          grep -Fq 'id="kf-local-photo-input"' /tmp/yourbusiness-freedom-3.html
          grep -Fq 'id="em-pictures"' /tmp/yourbusiness-emins-3.html
          grep -Fq 'id="dp-pictures"' /tmp/yourbusiness-paradies-3.html
          grep -Fq 'photo-credit' /tmp/yourbusiness-paradies-3.html
          echo 'YOURBUSINESS_TRIPLE_LIVE_ACCEPTANCE_ALL_PASS'
