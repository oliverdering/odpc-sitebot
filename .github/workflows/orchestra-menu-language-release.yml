name: ODPC orchestra menu and language release
on:
  push:
    branches: ['work/orchestra-menu-languages-20261114']
    paths: ['.github/workflows/orchestra-menu-language-release.yml']
permissions:
  contents: read
concurrency:
  group: odpc-orchestra-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Verify tested source
        run: |
          test "$(git rev-parse HEAD:orchestra-menu-release/index.html)" = "1cbbbab5c83706be451cccd82caabee6c7185b8a"
          test "$(git rev-parse HEAD:orchestra-menu-release/odpc-orchestra-menu.php)" = "ff12a3ac4b2026e01dd336340c35144dabe8b91f"
          php -l orchestra-menu-release/odpc-orchestra-menu.php
      - run: python3 -m pip install 'paramiko>=3.4,<5'
      - name: Publish homepage menu link
        env:
          ODPC_SFTP_PASSWORD: ${{ secrets.ODPC_SFTP_PASSWORD }}
        run: python3 -m orchestra-menu-release.deploy-home
      - name: Publish orchestra improvements
        env:
          ODPC_SFTP_PASSWORD: ${{ secrets.ODPC_SFTP_PASSWORD }}
          AI_ODPC_THEME_PATH: ${{ secrets.AI_ODPC_THEME_PATH }}
        run: python3 -m orchestra-menu-release.deploy-orchestra
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orchestra-before-menu-release
          path: orchestra-menu-backup/
          if-no-files-found: ignore
          retention-days: 15
