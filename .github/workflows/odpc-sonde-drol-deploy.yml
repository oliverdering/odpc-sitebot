name: ODPC / Sonde DROL presentation deploy
on:
  push:
    branches: [main]
    paths:
      - 'site-deploy/odpc.de/odpc-sonde-drol.php'
      - 'scripts/deploy_odpc_sonde_drol.py'
      - '.github/workflows/odpc-sonde-drol-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: odpc-sonde-drol
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Check syntax
        run: |
          php -l site-deploy/odpc.de/odpc-sonde-drol.php
          python3 -m py_compile scripts/deploy_odpc_sonde_drol.py
      - name: Install SFTP client
        run: python3 -m pip install 'paramiko>=3.4,<5'
      - name: Deploy and verify with rollback
        env:
          ODPC_SFTP_PASSWORD: ${{ secrets.ODPC_SFTP_PASSWORD }}
        run: python3 scripts/deploy_odpc_sonde_drol.py
      - name: Retain previous module
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odpc-sonde-previous-module
          path: odpc-sonde-backup/
          if-no-files-found: ignore
          retention-days: 15
