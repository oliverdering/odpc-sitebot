name: YourBusiness / Deploy ODPC Universal theme
on:
  push:
    paths:
      - 'yourbusiness/theme/odpc-universal/**'
      - 'scripts/deploy_yourbusiness_theme.py'
      - '.github/workflows/yourbusiness-theme-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: yourbusiness-serialized-operations
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate deployment script
        run: python -m py_compile scripts/deploy_yourbusiness_theme.py
      - name: Install SFTP dependency
        run: python -m pip install 'paramiko>=3.4,<5'
      - name: Upload isolated theme files via pinned SFTP
        env:
          ODPC_SFTP_PASSWORD: ${{ secrets.ODPC_SFTP_PASSWORD }}
        run: python scripts/deploy_yourbusiness_theme.py
