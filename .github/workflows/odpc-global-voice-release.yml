name: ODPC Global Voice - legacy verification only
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: odpc-helpermonkey-v4-bridge
  cancel-in-progress: false
jobs:
  release-odpc:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Check source, voice events and PHP
        shell: bash
        run: |
          set -euo pipefail
          php -l site-deploy/odpc.de/odpc-helpermonkey-v4-bridge.php
          python3 -m py_compile scripts/deploy_odpc_helpermonkey_v4_bridge.py
          grep -q 'id="odpc-reader-test"' site-deploy/odpc.de/odpc-helpermonkey-v4-bridge.php
          grep -q 'name="odpc-voice-build"' site-deploy/odpc.de/odpc-helpermonkey-v4-bridge.php
          grep -q 'SpeechSynthesisUtterance' site-deploy/odpc.de/odpc-helpermonkey-v4-bridge.php
      - name: Diagnose public cache and verify exact release on normal and uncached URLs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from urllib.request import Request,urlopen
          from urllib.parse import urlencode
          import time
          required=['name="odpc-voice-build" content="2026-11-10-audit-1"','id="odpc-reader-test"','id="odpc-reader-language"','id="odpc-reader-voice"']
          base='https://odpc.de/'
          for attempt in range(6):
              results={}
              for mode,url in [('normal',base),('cache_bypass',base+'?'+urlencode({'odpc_voice_probe':str(int(time.time()))}))]:
                  try:
                      req=Request(url,headers={'User-Agent':'Mozilla/5.0 ODPC-Voice-Release-Audit','Cache-Control':'no-cache','Pragma':'no-cache'})
                      with urlopen(req,timeout=25) as response:
                          body=response.read(700000).decode('utf-8','replace')
                          headers={k:v for k,v in response.headers.items() if k.lower() in ('age','cache-control','x-cache','x-litespeed-cache','cf-cache-status','server','vary')}
                          code=response.status
                      missing=[x for x in required if x not in body]
                      results[mode]=not missing
                      print(f'Attempt {attempt+1} {mode}: HTTP {code}; bytes={len(body)}; missing={missing}; headers={headers}',flush=True)
                  except Exception as exc:
                      results[mode]=False
                      print(f'Attempt {attempt+1} {mode}: {type(exc).__name__}: {exc}',flush=True)
              if all(results.values()):
                  print('PASS: exact release visible on both anonymous normal and cache-bypass URLs')
                  break
              if results.get('cache_bypass') and not results.get('normal'):
                  print('DIAGNOSIS: normal homepage is stale while cache-bypass is current; purge WordPress/IONOS/CDN page cache',flush=True)
              time.sleep(10)
          else:
              raise SystemExit('FAIL: release not visible on both normal and cache-bypass homepage URLs')
          PY
      - name: Save rollback backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odpc-global-voice-rollback-backup
          path: backup-odpc-v4-bridge/
          if-no-files-found: ignore
          retention-days: 15
