name: Helper Monkey / Brand, FAQ and mobile pages QA
on:
  push:
    paths:
      - 'scripts/helpermonkey-brand-faq-qa.mjs'
      - '.github/workflows/helpermonkey-brand-faq-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify all public brand and FAQ pages
        run: node scripts/helpermonkey-brand-faq-qa.mjs
