name: Orchestra review QA
on:
  push:
    branches: ['work/orchestra-review-20261114']
    paths: ['.github/workflows/orchestra-review-qa.yml']
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m py_compile orchestra-review-release/deploy.py
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: node orchestra-review-release/test.cjs
