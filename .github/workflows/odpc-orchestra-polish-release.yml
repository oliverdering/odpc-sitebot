name: ODPC orchestra visual release
on:
  push:
    branches: ['work/orchestra-polish-20261114']
    paths: ['.github/workflows/odpc-orchestra-polish-release.yml']
permissions:
  contents: read
concurrency:
  group: odpc-orchestra-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify tested source
        run: |
          test "$(git rev-parse HEAD:mission-control-polish/index.html)" = "721671bed7ae5aef2c2d13325b9fb8e81498ba05"
          python3 -m py_compile mission-control-polish/deploy.py
      - run: python3 -m pip install 'paramiko>=3.4,<5'
      - name: Deploy one page with backup and verification
        env:
          ODPC_SFTP_PASSWORD: ${{ secrets.ODPC_SFTP_PASSWORD }}
          AI_ODPC_THEME_PATH: ${{ secrets.AI_ODPC_THEME_PATH }}
        run: python3 -m mission-control-polish.deploy
      - name: Preserve previous version
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orchestra-polish-previous
          path: orchestra-polish-backup/
          retention-days: 15
          if-no-files-found: ignore
