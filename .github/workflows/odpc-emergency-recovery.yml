name: ODPC emergency HTTP 500 recovery
on:
  push:
    paths:
      - '.github/workflows/odpc-emergency-recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install 'paramiko>=3.4,<5'
      - name: Safely isolate latest MU plugin only if site is failing
        env:
          ODPC_SFTP_PASSWORD: ${{ secrets.ODPC_SFTP_PASSWORD }}
        run: |
          python - <<'PY'
          import sys,os,time,hashlib,hmac,base64
          from urllib.request import urlopen,Request
          from urllib.error import HTTPError
          import paramiko
          sys.path.insert(0,'scripts')
          from deploy_odpc_helpermonkey_v4_bridge import HOST,USER,PIN,ROOT
          def status():
            try:
              with urlopen(Request('https://odpc.de/?odpc_recovery='+str(time.time_ns()),headers={'Cache-Control':'no-cache','User-Agent':'ODPC-emergency-health'}),timeout=15) as r:return r.status
            except HTTPError as e:return e.code
            except Exception as e:print('Health check unavailable:',type(e).__name__);return 0
          before=[status(),status()]
          print('Pre-recovery status:',before,flush=True)
          if before != [500,500]:
            print('No confirmed persistent HTTP 500: no server changes',flush=True);sys.exit(0)
          t=paramiko.Transport((HOST,22));t.start_client(timeout=20)
          key='SHA256:'+base64.b64encode(hashlib.sha256(t.get_remote_server_key().asbytes()).digest()).decode().rstrip('=')
          if not hmac.compare_digest(key,PIN):raise RuntimeError('Host fingerprint mismatch')
          t.auth_password(USER,os.environ['ODPC_SFTP_PASSWORD'])
          s=paramiko.SFTPClient.from_transport(t)
          original=ROOT+'/wp-content/mu-plugins/odpc-helpermonkey-v4-bridge.php'
          disabled=original+'.emergency-disabled'
          try:
            s.stat(original)
            try:s.stat(disabled);raise RuntimeError('Emergency backup already exists: abort')
            except FileNotFoundError:pass
            s.rename(original,disabled)
            print('Bridge isolated, original preserved:',disabled,flush=True)
            time.sleep(3)
            after=[status(),status()]
            print('Post-isolation status:',after,flush=True)
            if 200 not in after:
              s.rename(disabled,original)
              print('ROLLBACK: HTTP 200 not recovered; original restored',flush=True)
              raise RuntimeError('Bridge isolation did not restore site: further diagnosis required')
            print('RECOVERED: HTTP 200 after isolating bridge; leave module safely disabled',flush=True)
          finally:s.close();t.close()
          PY
