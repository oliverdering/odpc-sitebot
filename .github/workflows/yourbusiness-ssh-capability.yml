name: YourBusiness / SSH capability check
on:
  push:
    paths:
      - .github/workflows/yourbusiness-ssh-capability.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: yourbusiness-serialized-operations
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SFTP_PASSWORD: ${{ secrets.ODPC_SFTP_PASSWORD }}
    steps:
      - name: Install Paramiko
        run: python -m pip install --quiet paramiko
      - name: Test remote command support without changes
        shell: bash
        run: |
          python - <<'PY'
          import os,base64,hashlib,hmac,paramiko
          if not os.environ.get('SFTP_PASSWORD'): raise SystemExit('Missing SFTP secret')
          tr=paramiko.Transport(('home119567219.1and1-data.host',22))
          tr.start_client(timeout=20)
          try:
              got='SHA256:'+base64.b64encode(hashlib.sha256(tr.get_remote_server_key().asbytes()).digest()).decode().rstrip('=')
              if not hmac.compare_digest(got,'SHA256:1gx2w8Rtv3wCgi7Jh8myf/KVd72cRQbow03UP8P095Q'):
                  raise RuntimeError('SSH host key mismatch')
              tr.auth_password('acc1461323326',os.environ['SFTP_PASSWORD'])
              if not tr.is_authenticated(): raise RuntimeError('Authentication failed')
              print('SSH authentication succeeded')
              channel=tr.open_session(timeout=12)
              try:
                  try:
                      channel.exec_command('printf ODPC_EXEC_OK')
                      output=channel.makefile('rb').read(128).decode('utf-8','replace')
                      print('Remote execution supported:',output.strip()=='ODPC_EXEC_OK')
                  except Exception as e:
                      print('Remote execution unavailable:',type(e).__name__)
              finally:channel.close()
          finally:tr.close()
          PY
