name: YourBusiness / Live demo acceptance test
on:
  push:
    paths:
      - '.github/workflows/yourbusiness-demo-smoke-test.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: yourbusiness-serialized-operations
  cancel-in-progress: false
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify WordPress plugin, shortcode and page via SSH
        env:
          SSHPASS: ${{ secrets.ODPC_SSH_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          sudo apt-get install -y -qq sshpass >/dev/null
          mkdir -p ~/.ssh
          ssh-keyscan -4 -t ed25519 home119567219.1and1-data.host > ~/.ssh/known_hosts 2>/dev/null
          ssh-keygen -lf ~/.ssh/known_hosts | grep -F 'SHA256:1gx2w8Rtv3wCgi7Jh8myf/KVd72cRQbow03UP8P095Q' >/dev/null
          sshpass -e ssh -4 -o BatchMode=no -o PreferredAuthentications=password -o PubkeyAuthentication=no -o NumberOfPasswordPrompts=1 -o StrictHostKeyChecking=yes -o ConnectTimeout=20 p37641258@home119567219.1and1-data.host 'set -eu
            cd "$HOME/YourBusiness"
            uiwpcli_PHP_FLAVOR=php8.3 wp core is-installed --quiet
            uiwpcli_PHP_FLAVOR=php8.3 wp plugin is-active yourbusiness-instant-demo
            test -f wp-content/plugins/yourbusiness-instant-demo/yourbusiness-instant-demo.php
            grep -q "add_shortcode.*yourbusiness_demo" wp-content/plugins/yourbusiness-instant-demo/yourbusiness-instant-demo.php
            id=$(uiwpcli_PHP_FLAVOR=php8.3 wp post list --post_type=page --name=sofort-demo --field=ID --format=ids)
            test -n "$id"
            body=$(uiwpcli_PHP_FLAVOR=php8.3 wp post get "$id" --field=post_content)
            test "$body" = "[yourbusiness_demo]"
            echo "YOURBUSINESS_WORDPRESS_DEMO_READY"
          '
      - name: Check public HTTPS demo
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --max-time 25 --retry 2 --output /tmp/yb-demo.html --write-out 'HTTP %{http_code}; final URL %{url_effective}\n' 'https://yourbusiness.odpc.de/?yb_start=1'
          grep -q 'id="yb-mobile-builder"' /tmp/yb-demo.html
          grep -q 'id="yb-demo"' /tmp/yb-demo.html
          grep -q 'id="yb-build"' /tmp/yb-demo.html
          grep -q 'id="yb-google-search"' /tmp/yb-demo.html
          grep -q 'id="yb-whatsapp"' /tmp/yb-demo.html
          # Verify both real public design variants, links, scope isolation and anchors.
          curl --fail --location --silent --show-error --max-time 25 --retry 2 -o /tmp/kf-classic.html 'https://yourbusiness.odpc.de/?yb_kleine_freiheit=1&design=klassisch'
          curl --fail --location --silent --show-error --max-time 25 --retry 2 -o /tmp/kf-modern.html 'https://yourbusiness.odpc.de/?yb_kleine_freiheit=1&design=modern'
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Inspector(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids=set()
                  self.hrefs=[]
                  self.modes=[]
                  self.title=''
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if 'id' in a:self.ids.add(a['id'])
                  if tag=='a':
                      self.hrefs.append(a.get('href',''))
                      if a.get('data-kf-mode'):self.modes.append((a['data-kf-mode'],a.get('aria-current')))
          classic=Path('/tmp/kf-classic.html').read_text()
          modern=Path('/tmp/kf-modern.html').read_text()
          for label,html in [('klassisch',classic),('modern',modern)]:
              p=Inspector()
              p.feed(html)
              assert '<!doctype html>' in html.lower(),label
              assert f'class="kf-theme-{label}"' in html,label
              assert {'kf-demo','kf-start','kf-about','kf-drinks','kf-story','kf-events','kf-visit','kf-legal'}.issubset(p.ids),(label,p.ids)
              assert {mode for mode,_ in p.modes}=={'klassisch','modern'},(label,p.modes)
              assert sum(mode==label and current=='page' for mode,current in p.modes)==1,(label,p.modes)
              for href in p.hrefs:
                  assert href and href!='#', (label,href)
                  if href.startswith('#'):assert href[1:] in p.ids,(label,href)
              assert any(h.startswith('tel:') for h in p.hrefs),label
              assert any('google.com/maps' in h for h in p.hrefs),label
              assert any('odpc.de' in h for h in p.hrefs),label
              assert 'class="yb-launch-cta"' not in html,label
              assert 'yb-mobile-builder' not in html,label
              assert 'wp-block-navigation' not in html,label
              assert 'kf-theme-klassisch' in html and 'kf-theme-modern' in html,label
              assert 'data-kf-mode' in html,label
              assert 'class="kf-float-nav"' in html,label
              assert 'max-width:700px' in html,label
          assert classic!=modern,'Design variant endpoint ignores query string'
          print('KLEINE_FREIHEIT_TWO_THEMES_AND_LINKS_READY')
          PY
          curl --fail --location --silent --show-error --max-time 25 --retry 2 --output /tmp/yb-home.html 'https://yourbusiness.odpc.de/'
          grep -q 'Jetzt Kundenwebseite live erstellen' /tmp/yb-home.html
          echo "YOURBUSINESS_MOBILE_BUILDER_AND_ENTRY_READY"
      - name: Verify research scripts and real public lookup endpoint
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'window.YourBusinessResearch' /tmp/yb-demo.html
          grep -q 'research.js' /tmp/yb-demo.html
          curl --fail --location --silent --show-error --max-time 25 --retry 2 -o /tmp/yb-research.js 'https://yourbusiness.odpc.de/wp-content/plugins/yourbusiness-instant-demo/research.js'
          grep -q 'Firmendaten automatisch recherchieren' /tmp/yb-research.js
          node --check /tmp/yb-research.js
          grep -q 'yb-menu-draft' /tmp/yb-research.js
          grep -q 'yb_company' /tmp/yb-research.js
          python - <<'PY' > /tmp/yb-nonce.txt
          import re,json
          html = open('/tmp/yb-demo.html').read()
          match = re.search(r'window\.YourBusinessResearch\s*=\s*(\{.*?\})\s*;', html, re.S)
          if not match: raise SystemExit('Research bootstrap JSON not found')
          config=json.loads(match.group(1))
          assert config['url'].startswith('https://yourbusiness.odpc.de/')
          print(config['nonce'])
          PY
          curl --fail --location --silent --show-error --max-time 25 --retry 2 \
            -o /tmp/yb-discover.json \
            --data-urlencode 'action=yb_discover' \
            --data-urlencode "nonce=$(cat /tmp/yb-nonce.txt)" \
            --data-urlencode 'company=Kleine Freiheit' \
            --data-urlencode 'city=Koblenz' \
            'https://yourbusiness.odpc.de/wp-admin/admin-ajax.php'
          python - <<'PY'
          import json
          o=json.load(open('/tmp/yb-discover.json'))
          assert o['success'] is True, o
          a=o['data']['candidates']
          assert a and a[0]['name']=='Kleine Freiheit' and 'Altenhof 6' in a[0]['address']
          assert 'intro' in a[0] and 'history' in a[0]
          assert len(a[0].get('menu_sections', [])) == 3
          assert sum(len(s['items']) for s in a[0]['menu_sections']) == 12
          assert len(a[0].get('publication_checks', [])) >= 5
          assert a[0].get('imprint', '') == ''
          assert all('sample_price' in item for sec in a[0]['menu_sections'] for item in sec['items'])
          print('YOURBUSINESS_PUBLIC_RESEARCH_ENDPOINT_READY')
          PY
