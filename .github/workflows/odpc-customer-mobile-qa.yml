name: ODPC / Customer pages mobile QA
on:
  push:
    paths:
      - 'scripts/odpc_customer_mobile_qa.mjs'
      - '.github/workflows/odpc-customer-mobile-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify references and partner bonus on mobile and desktop
        run: node scripts/odpc_customer_mobile_qa.mjs
