name: Audit ODPC TV streams
on:
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check candidate HLS streams
        run: |
          python scripts/audit_odpc_tv_streams.py --playlist scripts/odpc_tv_ubuntuusers_candidates.m3u --output tv-audit-results.json --limit 100
      - uses: actions/upload-artifact@v4
        with:
          name: odpc-tv-stream-audit
          path: tv-audit-results.json
          retention-days: 14
