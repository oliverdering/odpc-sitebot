name: ODPC orchestra FAQ release
on:
  push:
    branches: ['work/orchestra-faq-20261114']
    paths: ['.github/workflows/odpc-orchestra-faq-release.yml']
permissions:
  contents: read
concurrency:
  group: odpc-orchestra-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify tested source
        run: |
          test "$(git rev-parse HEAD:mission-control-faq/index.html)" = "972dad01b234e34f36e066ecc81c08b9c703f559"
          python3 -m py_compile mission-control-faq/deploy.py
      - run: python3 -m pip install 'paramiko>=3.4,<5'
      - name: Deploy one page with backup and verification
        env:
          ODPC_SFTP_PASSWORD: ${{ secrets.ODPC_SFTP_PASSWORD }}
          AI_ODPC_THEME_PATH: ${{ secrets.AI_ODPC_THEME_PATH }}
        run: python3 -m mission-control-faq.deploy
      - name: Preserve previous version
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orchestra-faq-previous
          path: orchestra-faq-backup/
          retention-days: 15
          if-no-files-found: ignore
