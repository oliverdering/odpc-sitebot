name: AdminMonkey continuous knowledge cycles
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/adminmonkey-daily-knowledge.yml'
      - 'adminmonkey/knowledge/*.py'
      - 'adminmonkey/database/*.py'
      - 'adminmonkey/academy/competency_bank.json'
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
concurrency:
  group: adminmonkey-knowledge-growth
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore private crawl state from Actions cache
        uses: actions/cache/restore@v4
        with:
          path: adminmonkey/knowledge/crawl_state.json
          key: adminmonkey-crawl-${{ github.run_id }}
          restore-keys: |
            adminmonkey-crawl-
      - name: Collect bounded Microsoft Learn articles
        run: python adminmonkey/knowledge/crawl_learn.py
      - name: Cache crawl progress privately
        uses: actions/cache/save@v4
        with:
          path: adminmonkey/knowledge/crawl_state.json
          key: adminmonkey-crawl-${{ github.run_id }}
      - name: Collect Microsoft Learn evidence and update persistent index
        run: python adminmonkey/knowledge/monitor.py
      - name: Run transparent academy baseline checks
        run: python adminmonkey/knowledge/exam_baseline.py
      - name: Generate honest Academy progress snapshot
        run: python adminmonkey/knowledge/build_progress.py
      - name: Validate generated JSON and learning evidence
        run: |
          python -m json.tool adminmonkey/knowledge/academy_progress.json > /dev/null
          python -m json.tool adminmonkey/knowledge/document_manifest.json > /dev/null
          python -m json.tool adminmonkey/knowledge/knowledge_index.json > /dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("adminmonkey/knowledge")
          progress = json.loads((root / "academy_progress.json").read_text())
          manifest = json.loads((root / "document_manifest.json").read_text())
          assert progress["knowledge"]["documents_collected"] == len(manifest["documents"]), "document counts disagree"
          if not manifest["documents"]:
              print("WARNING: zero documents; publishing diagnostic snapshot rather than suppressing progress")
          print("Verified document count:", len(manifest["documents"]))
          PY
      - name: Commit evidence updates even when crawl collected zero documents
        run: |
          git config user.name "adminmonkey-knowledge-bot"
          git config user.email "adminmonkey-knowledge-bot@users.noreply.github.com"
          git add adminmonkey/knowledge/knowledge_index.json adminmonkey/knowledge/academy_progress.json adminmonkey/knowledge/document_manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "data(adminmonkey): refresh Microsoft Learn evidence index [skip ci]"
            git push
          fi
      - name: Install MariaDB driver
        run: python -m pip install 'PyMySQL==1.1.1'
      - name: Diagnose MariaDB connectivity without exposing secrets
        env:
          AMK_DB_HOST: ${{ secrets.AMK_DB_HOST }}
          AMK_DB_PORT: ${{ secrets.AMK_DB_PORT }}
          AMK_DB_NAME: ${{ secrets.AMK_DB_NAME }}
          AMK_DB_USER: ${{ secrets.AMK_DB_USER }}
          AMK_DB_PASSWORD: ${{ secrets.AMK_DB_PASSWORD }}
        run: |
          python - <<'PY'
          import json, os, socket
          from pathlib import Path
          import pymysql
          keys = ("HOST", "NAME", "USER", "PASSWORD")
          missing = [k for k in keys if not os.environ.get("AMK_DB_" + k)]
          result = {"database_connected": False, "missing_secret_names": missing}
          if missing:
              result["verdict"] = "MISSING_SECRETS"
          else:
              host = os.environ["AMK_DB_HOST"]
              try:
                  port = int(os.environ.get("AMK_DB_PORT") or "3306")
                  socket.getaddrinfo(host, port)
                  result["dns_ok"] = True
                  socket.create_connection((host, port), timeout=6).close()
                  result["tcp_ok"] = True
                  con = pymysql.connect(host=host, port=port, user=os.environ["AMK_DB_USER"],
                      password=os.environ["AMK_DB_PASSWORD"], database=os.environ["AMK_DB_NAME"],
                      connect_timeout=8, read_timeout=10)
                  try:
                      with con.cursor() as cur:
                          cur.execute("SELECT 1")
                          cur.fetchone()
                      result.update(database_connected=True, verdict="OK")
                  finally:
                      con.close()
              except Exception as exc:
                  code = exc.args[0] if exc.args and isinstance(exc.args[0], int) else None
                  result["error_type"] = type(exc).__name__
                  if code is not None: result["mysql_errno"] = code
                  result["verdict"] = ("DNS_FAILED" if not result.get("dns_ok") else
                      "TCP_UNREACHABLE" if not result.get("tcp_ok") else
                      "AUTH_OR_DB_ERROR")
          out = Path("adminmonkey/knowledge/database_diagnostics.json")
          out.write_text(json.dumps(result, indent=2) + "\n")
          print("MariaDB diagnosis:", result["verdict"])
          PY
      - name: Import new knowledge into existing MariaDB
        env:
          AMK_DB_HOST: ${{ secrets.AMK_DB_HOST }}
          AMK_DB_PORT: ${{ secrets.AMK_DB_PORT }}
          AMK_DB_NAME: ${{ secrets.AMK_DB_NAME }}
          AMK_DB_USER: ${{ secrets.AMK_DB_USER }}
          AMK_DB_PASSWORD: ${{ secrets.AMK_DB_PASSWORD }}
        run: python adminmonkey/database/migrate_import.py --apply
        continue-on-error: true
      - name: Persist verified database progress if import succeeded
        run: |
          if test -f adminmonkey/knowledge/database_progress.json; then
            git add adminmonkey/knowledge/database_progress.json
            if ! git diff --cached --quiet; then
              git commit -m "data(adminmonkey): publish verified MariaDB totals [skip ci]"
              git push
            fi
          fi

      - name: Publish database diagnostics and totals to main
        if: always()
        run: |
          git config user.name "adminmonkey-knowledge-bot"
          git config user.email "adminmonkey-knowledge-bot@users.noreply.github.com"
          for file in database_diagnostics.json database_progress.json; do
            if test -f "adminmonkey/knowledge/$file"; then git add "adminmonkey/knowledge/$file"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "data(adminmonkey): publish database diagnostics [skip ci]"
            for i in 1 2 3; do
              if git pull --rebase --autostash origin main && git push origin HEAD:main; then exit 0; fi
              sleep $((i * 3))
            done
            exit 1
          fi
      - name: Verify crawler isolation and record failing test
        if: always()
        run: |
          set -o pipefail
          python -m unittest discover -s adminmonkey/knowledge -p 'test_*.py' -v 2>&1 | tee adminmonkey/knowledge/last_test_report.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adminmonkey-knowledge-index
          path: |
            adminmonkey/knowledge/knowledge_index.json
            adminmonkey/knowledge/exam_baseline.json
            adminmonkey/knowledge/academy_progress.json
            adminmonkey/knowledge/document_manifest.json
            adminmonkey/knowledge/database_progress.json
            adminmonkey/knowledge/database_diagnostics.json
            adminmonkey/knowledge/last_test_report.txt
          retention-days: 30
