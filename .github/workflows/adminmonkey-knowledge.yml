name: AdminMonkey Microsoft knowledge monitor
on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'
permissions:
  contents: read
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Monitor approved Microsoft Learn sources
        run: python adminmonkey/academy/collect_sources.py
      - name: Upload source snapshot for review
        uses: actions/upload-artifact@v4
        with:
          name: adminmonkey-microsoft-knowledge-snapshot
          path: adminmonkey/academy/knowledge_snapshot.json
          retention-days: 30
