name: AdminMonkey retrieval pilot verification
on:
  pull_request:
    paths:
      - 'adminmonkey/knowledge/retrieval_pilot.py'
      - 'adminmonkey/knowledge/test_retrieval_pilot.py'
      - '.github/workflows/adminmonkey-retrieval-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: adminmonkey-retrieval-pilot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify offline retrieval
        run: python -m unittest discover -s adminmonkey/knowledge -p 'test_retrieval_pilot.py' -v
      - name: Restore existing private Microsoft Learn state
        uses: actions/cache/restore@v4
        with:
          path: adminmonkey/knowledge/crawl_state.json
          key: adminmonkey-retrieval-pilot-${{ github.run_id }}
          restore-keys: |
            adminmonkey-crawl-
      - name: Search existing source corpus without publishing texts
        shell: bash
        run: |
          if [ ! -s adminmonkey/knowledge/crawl_state.json ]; then
            echo "::error::No accessible crawl state. No real corpus result can be claimed."
            exit 1
          fi
          python adminmonkey/knowledge/retrieval_pilot.py --state adminmonkey/knowledge/crawl_state.json --question "conditional access authentication" --limit 3 > "$RUNNER_TEMP/amk-retrieval-result.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"amk-retrieval-result.json"
          r=json.loads(p.read_text())
          print("Source documents:",r["source_documents"])
          print("Hash-verified chunked documents:",r["chunked_documents"])
          print("Matching snippets:",len(r["matches"]))
          for hit in r["matches"]:
              print("Source:",hit["source_url"],"chunk:",hit["chunk_index"],"digest:",hit["chunk_sha256"])
          if not r["matches"]:
              raise SystemExit("No matching evidence in retrieved corpus")
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("## AdminMonkey retrieval pilot\n")
              f.write(f"Existing crawler documents: {r['source_documents']}; hash-verified documents: {r['chunked_documents']}; candidate snippets: {len(r['matches'])}.\n")
              f.write("This tests source lookup only. It is not a generated answer, verified competency, live database query, or certification.\n")
          PY
