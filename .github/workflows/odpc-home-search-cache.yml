name: ODPC / Refresh homepage SEO cache
on:
  push:
    paths:
      - 'scripts/refresh_odpc_home_search_cache.py'
      - '.github/workflows/odpc-home-search-cache.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: odpc-home-search-cache
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Validate script
        run: python3 -m py_compile scripts/refresh_odpc_home_search_cache.py
      - name: Install SFTP client
        run: python3 -m pip install 'paramiko>=3.4,<5'
      - name: Expire verified stale homepage cache
        env:
          ODPC_SFTP_PASSWORD: ${{ secrets.ODPC_SFTP_PASSWORD }}
        run: python3 scripts/refresh_odpc_home_search_cache.py
      - name: Preserve expired cached HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: previous-odpc-home-cache
          path: backup-odpc-home-cache/
          if-no-files-found: ignore
          retention-days: 15
