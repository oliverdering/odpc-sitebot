name: AdminMonkey IONOS-local knowledge import
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/adminmonkey-ionos-knowledge-import.yml'
      - 'scripts/adminmonkey_ionos_knowledge_import.py'
      - 'adminmonkey/knowledge/crawl_learn.py'
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
concurrency:
  group: adminmonkey-knowledge-growth
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: adminmonkey-production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@v4
        with:
          path: adminmonkey/knowledge/crawl_state.json
          key: adminmonkey-crawl-${{ github.run_id }}
          restore-keys: |
            adminmonkey-crawl-
      - name: Crawl fresh Microsoft Learn documents before database import
        run: |
          python adminmonkey/knowledge/crawl_learn.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("adminmonkey/knowledge/crawl_state.json")
          state=json.loads(p.read_text())
          docs=state.get("documents",{})
          assert docs, "Crawler produced no documents"
          print("Crawl batch:",state.get("last_batch",{}))
          print("Hash-verifiable candidate documents:",len(docs))
          PY
      - name: Persist crawl state for subsequent knowledge cycles
        uses: actions/cache/save@v4
        with:
          path: adminmonkey/knowledge/crawl_state.json
          key: adminmonkey-crawl-${{ github.run_id }}
      - name: Install pinned SFTP client
        run: python -m pip install 'paramiko==3.5.1'
      - name: Import verified Microsoft Learn documents into MariaDB
        env:
          ODPC_SFTP_PASSWORD: ${{ secrets.ODPC_SFTP_PASSWORD }}
          AMK_DB_HOST: db5021870301.hosting-data.io
          AMK_DB_PORT: '3306'
          AMK_DB_NAME: ${{ secrets.AMK_DB_NAME }}
          AMK_DB_USER: ${{ secrets.AMK_DB_USER }}
          AMK_DB_PASSWORD: ${{ secrets.AMK_DB_PASSWORD }}
        run: python scripts/adminmonkey_ionos_knowledge_import.py
      - name: Publish confirmed database totals
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "adminmonkey-knowledge-bot"
          git config user.email "adminmonkey-knowledge-bot@users.noreply.github.com"
          progress_file="adminmonkey/knowledge/database_progress.json"
          cp "$progress_file" "$RUNNER_TEMP/database_progress.json"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP/database_progress.json" "$progress_file"
            git add "$progress_file"
            if git diff --cached --quiet; then
              echo "Database progress already published"
              exit 0
            fi
            git commit -m "data(adminmonkey): verified MariaDB import totals [skip ci]"
            if git push origin HEAD:main; then
              echo "Database progress published to main"
              exit 0
            fi
            sleep $((i * 2))
          done
          echo "::error::Failed to publish database totals after 5 attempts"
          exit 1
