name: AdminMonkey IONOS-local knowledge import
on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: write
concurrency:
  group: adminmonkey-ionos-knowledge-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: adminmonkey-production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@v4
        with:
          path: adminmonkey/knowledge/crawl_state.json
          key: adminmonkey-crawl-${{ github.run_id }}
          restore-keys: |
            adminmonkey-crawl-
      - name: Install pinned SFTP client
        run: python -m pip install 'paramiko==3.5.1'
      - name: Import verified Microsoft Learn documents into MariaDB
        env:
          ODPC_SFTP_PASSWORD: ${{ secrets.ODPC_SFTP_PASSWORD }}
          AMK_DB_HOST: db5021870301.hosting-data.io
          AMK_DB_PORT: '3306'
          AMK_DB_NAME: ${{ secrets.AMK_DB_NAME }}
          AMK_DB_USER: ${{ secrets.AMK_DB_USER }}
          AMK_DB_PASSWORD: ${{ secrets.AMK_DB_PASSWORD }}
        run: python scripts/adminmonkey_ionos_knowledge_import.py
      - name: Publish confirmed database totals
        run: |
          git config user.name "adminmonkey-knowledge-bot"
          git config user.email "adminmonkey-knowledge-bot@users.noreply.github.com"
          git add adminmonkey/knowledge/database_progress.json
          if ! git diff --cached --quiet; then
            git commit -m "data(adminmonkey): verified MariaDB import totals [skip ci]"
            for i in 1 2 3; do
              if git pull --rebase --autostash origin main && git push origin HEAD:main; then exit 0; fi
              sleep $((i * 3))
            done
            exit 1
          fi
