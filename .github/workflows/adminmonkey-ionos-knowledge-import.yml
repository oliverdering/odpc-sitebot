name: AdminMonkey Master Cycle (5 min)
# Single scheduled owner: crawl -> evidence/tests -> MariaDB -> synchronized snapshots.
# Operator-requested immediate verification after chunk-normalization fix on 2026-11-10; no runtime behavior change.
# Monitor UI deployment remains an independent change-triggered workflow.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/adminmonkey-ionos-knowledge-import.yml'
      - 'scripts/adminmonkey_ionos_knowledge_import.py'
      - 'adminmonkey/knowledge/*.py'
      - 'adminmonkey/academy/competency_bank.json'
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
concurrency:
  group: adminmonkey-knowledge-growth
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: adminmonkey-production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@v4
        with:
          path: adminmonkey/knowledge/crawl_state.json
          key: adminmonkey-crawl-${{ github.run_id }}
          restore-keys: |
            adminmonkey-crawl-
      - name: Crawl fresh Microsoft Learn documents before database import
        run: |
          python adminmonkey/knowledge/crawl_learn.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("adminmonkey/knowledge/crawl_state.json")
          state=json.loads(p.read_text())
          docs=state.get("documents",{})
          assert docs, "Crawler produced no documents"
          print("Crawl batch:",state.get("last_batch",{}))
          print("Hash-verifiable candidate documents:",len(docs))
          PY
      - name: Generate validated Academy snapshot from the same crawl
        run: |
          python adminmonkey/knowledge/monitor.py
          python adminmonkey/knowledge/exam_baseline.py
          python -m unittest discover -s adminmonkey/knowledge -p 'test_assess_ms102.py' -v
          python -m unittest discover -s adminmonkey/knowledge -p 'test_chunk_documents.py' -v
          python adminmonkey/knowledge/chunk_documents.py
          python adminmonkey/knowledge/build_progress.py
          python -m unittest discover -s adminmonkey/knowledge -p 'test_knowledge_integrity.py' -v
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('adminmonkey/knowledge')
          progress=json.loads((root/'academy_progress.json').read_text())
          manifest=json.loads((root/'document_manifest.json').read_text())
          assert progress['knowledge']['documents_collected']==len(manifest['documents'])
          assert progress['official_microsoft_certification'] is False
          print('Validated Academy snapshot:',len(manifest['documents']))
          PY
      - name: Persist crawl state for subsequent knowledge cycles
        uses: actions/cache/save@v4
        with:
          path: adminmonkey/knowledge/crawl_state.json
          key: adminmonkey-crawl-${{ github.run_id }}
      - name: Install pinned SFTP client
        run: python -m pip install 'paramiko==3.5.1'
      - name: Import verified Microsoft Learn documents into MariaDB
        env:
          ODPC_SFTP_PASSWORD: ${{ secrets.ODPC_SFTP_PASSWORD }}
          AMK_DB_HOST: db5021870301.hosting-data.io
          AMK_DB_PORT: '3306'
          AMK_DB_NAME: ${{ secrets.AMK_DB_NAME }}
          AMK_DB_USER: ${{ secrets.AMK_DB_USER }}
          AMK_DB_PASSWORD: ${{ secrets.AMK_DB_PASSWORD }}
        run: python scripts/adminmonkey_ionos_knowledge_import.py
      - name: Publish verified database and Academy snapshots atomically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "adminmonkey-knowledge-bot"
          git config user.email "adminmonkey-knowledge-bot@users.noreply.github.com"
          files=(adminmonkey/knowledge/database_progress.json adminmonkey/knowledge/academy_progress.json adminmonkey/knowledge/document_manifest.json adminmonkey/knowledge/knowledge_index.json)
          mkdir -p "$RUNNER_TEMP/adminmonkey-sync"
          for file in "${files[@]}"; do cp "$file" "$RUNNER_TEMP/adminmonkey-sync/$(basename "$file")"; done
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            for file in "${files[@]}"; do cp "$RUNNER_TEMP/adminmonkey-sync/$(basename "$file")" "$file"; done
            git add "${files[@]}"
            if git diff --cached --quiet; then echo "Snapshots already published"; exit 0; fi
            git commit -m "data(adminmonkey): synchronized verified Academy and MariaDB snapshots [skip ci]"
            if git push origin HEAD:main; then echo "Synchronized snapshots published to main"; exit 0; fi
            sleep $((i * 2))
          done
          echo "::error::Failed to publish synchronized snapshots"
          exit 1
