name: ODPC / Real mobile navigation QA
on:
  push:
    paths:
      - scripts/qa_odpc_header.js
      - .github/workflows/odpc-mobile-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare Chrome browser
        run: |
          command -v google-chrome
          google-chrome --version
          npm install --no-save playwright@1.56.1
          mkdir -p odpc-screenshots
      - name: Verify closed menu, opening, links, escape and page widths
        run: node scripts/qa_odpc_header.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: odpc-responsive-screenshots
          path: odpc-screenshots/
          if-no-files-found: ignore
          retention-days: 10
