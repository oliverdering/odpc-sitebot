name: D.R.O.L. / IONOS-local MariaDB probe
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: drol-ionos-db-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate probe
        run: python3 -m py_compile scripts/drol_ionos_db_probe.py
      - name: Install SFTP client
        run: python3 -m pip install 'paramiko>=3.4,<5'
      - name: Probe MariaDB from IONOS webspace (read-only)
        env:
          ODPC_SFTP_PASSWORD: ${{ secrets.ODPC_SFTP_PASSWORD }}
          DROL_DB_PASSWORD: ${{ secrets.DROL_DB_PASSWORD }}
        run: python3 scripts/drol_ionos_db_probe.py
