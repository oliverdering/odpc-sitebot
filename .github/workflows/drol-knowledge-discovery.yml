name: D.R.O.L. / Autonomous knowledge discovery
on:
  schedule:
    - cron: '11 */3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/drol-knowledge-discovery.yml'
      - 'scripts/drol_release_watch.py'
      - 'tests/test_drol_release_watch.py'
      - 'scripts/drol_growth_monitor.py'
      - 'scripts/drol_publish_release_feed.py'
      - 'scripts/drol_ionos_candidate_ingest.py'
permissions:
  contents: read
  issues: write
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate discovery script
        run: python3 -m py_compile scripts/drol_release_watch.py scripts/drol_ionos_candidate_ingest.py scripts/drol_publish_release_feed.py
      - name: Verify evidence extraction regression tests
        run: python3 -m unittest discover -s tests -p 'test_drol_release_watch.py' -v
      - name: Discover new releases and create deduplicated review issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/drol_release_watch.py
      - name: Validate provenance and evidence isolation before publishing
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          data=json.loads(Path('drol-release-candidates.json').read_text())
          rows=data['candidates']
          assert rows and len(rows)<=30
          for row in rows:
              assert row['evidence_level']=='E0'
              assert row['status']=='UNREVIEWED'
              assert row['model_compatibility']=='UNKNOWN'
              assert re.fullmatch(r'https://github[.]com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+/releases/tag/.+',row['url'])
              notes=row['release_notes']
              assert len(notes['excerpt'])<=1200
              assert notes['sha256'] is None or re.fullmatch(r'[a-f0-9]{64}',notes['sha256'])
              assert set(notes['topics'])<=set(('security','api_change','firmware','sensor','navigation'))
          print('PASS provenance and E0 isolation:',len(rows),'candidates')
          PY
      - name: Install secured SFTP bridge
        run: python3 -m pip install 'paramiko>=3.4,<5'
      - name: Publish public E0 release feed
        env:
          ODPC_SFTP_PASSWORD: ${{ secrets.ODPC_SFTP_PASSWORD }}
        run: python3 scripts/drol_publish_release_feed.py
      - name: Verify public release feed matches current discovery
        run: |
          python3 - <<'PY'
          import json,time
          from urllib.request import Request,urlopen
          expected=json.load(open('drol-release-candidates.json'))
          expected_urls={x['url'] for x in expected['candidates']}
          for attempt in range(6):
              try:
                  req=Request('https://drol.odpc.de/data/releases.json',headers={'Cache-Control':'no-cache'})
                  with urlopen(req,timeout=20) as response:
                      feed=json.load(response)
                  assert feed['schema_version']==1
                  assert feed['count']==len(feed['releases'])
                  assert {x['url'] for x in feed['releases']}==expected_urls
                  assert all(x['evidence_level']=='E0' and x['compatibility']=='UNKNOWN' for x in feed['releases'])
                  print('PASS public release feed:',feed['count'],'items')
                  break
              except Exception as exc:
                  if attempt==5:raise RuntimeError('Public release feed not verified') from exc
                  time.sleep(10)
          PY
      - name: Import newly discovered facts into MariaDB as pending E0 knowledge
        env:
          ODPC_SFTP_PASSWORD: ${{ secrets.ODPC_SFTP_PASSWORD }}
          DROL_DB_PASSWORD: ${{ secrets.DROL_DB_PASSWORD }}
        run: python3 scripts/drol_ionos_candidate_ingest.py
      - name: Retain machine-readable candidates
        uses: actions/upload-artifact@v4
        with:
          name: drol-release-candidates
          path: drol-release-candidates.json
          if-no-files-found: error
          retention-days: 30
