name: AdminMonkey Microsoft Credential Discovery
on:
  push:
    branches: [main]
    paths:
      - 'adminmonkey/knowledge/discover_certifications.py'
      - 'adminmonkey/academy/certification_candidates_2026.json'
      - '.github/workflows/adminmonkey-credential-discovery.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'
permissions:
  contents: read
concurrency:
  group: adminmonkey-credential-discovery
  cancel-in-progress: false
jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate candidate registry and Python syntax
        run: |
          python -m py_compile adminmonkey/knowledge/discover_certifications.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('adminmonkey/academy/certification_candidates_2026.json')
          data=json.loads(p.read_text())
          codes=[x['exam_code'] for x in data['exam_candidates']]
          assert len(codes)==42 and len(set(codes))==len(codes)
          assert all(x['verification_status']=='pending_official_source' for x in data['exam_candidates'])
          print('PASS: 42 unique unverified exam candidates; existing Academy data untouched')
          PY
      - name: Discover official Microsoft Learn search references
        run: python adminmonkey/knowledge/discover_certifications.py
      - name: Validate discovery evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('adminmonkey/academy/certification_discovery_report.json')
          d=json.loads(p.read_text())
          assert d['verification_status']=='discovery_only_not_verified'
          assert len(d['records'])==42
          print('PASS: 42 discovery records, no certification claims')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: adminmonkey-microsoft-credential-discovery
          path: adminmonkey/academy/certification_discovery_report.json
          retention-days: 30
