name: Piper Eva model-map experiment
on:
  push:
    paths: ['.github/workflows/piper-eva-map-experiment.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: npm install --no-save @mintplex-labs/piper-tts-web@1.0.4 onnxruntime-web@1.18.0 esbuild@0.25.12
      - name: Patch local test copy only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('node_modules/@mintplex-labs/piper-tts-web/dist/piper-tts-web.js')
          s=p.read_text()
          s=s.replace('new Promise(async (resolve) => {','new Promise(async (resolve, reject) => {')
          old='resolve(JSON.parse(data).phoneme_ids);'
          new="""const payload = JSON.parse(data);
          const mapping = __privateGet(this, _modelConfig).phoneme_id_map;
          const ids = [...mapping['^'], ...mapping['_']];
          for (const phoneme of Array.from(payload.phonemes.join('').normalize('NFC'))) {
            if (!Object.hasOwn(mapping, phoneme)) { reject(new Error('Missing model phoneme: ' + JSON.stringify(phoneme))); return; }
            ids.push(...mapping[phoneme], ...mapping['_']);
          }
          ids.push(...mapping['$']);
          resolve(ids);"""
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          PY
      - run: npx esbuild node_modules/@mintplex-labs/piper-tts-web/dist/piper-tts-web.js --bundle --format=esm --platform=browser --external:fs --external:path --outfile=patched-piper.mjs
      - run: python3 -m pip install 'playwright>=1.50,<2'
      - run: python3 -m playwright install --with-deps chromium
      - name: Generate and decode Eva audio
        run: |
          python3 -m http.server 8765 >/tmp/piper-http.log 2>&1 &
          python3 - <<'PY'
          from playwright.sync_api import sync_playwright
          import json,base64,pathlib
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=['--no-sandbox'])
              site=browser.new_page()
              site.goto('https://odpc.de/',wait_until='domcontentloaded',timeout=60000)
              homepage=site.locator('#odpc-home').inner_text()[:700]
              if len(homepage)<100: raise RuntimeError('Could not read homepage test text')
              site.close()
              page=browser.new_page()
              page.goto('http://localhost:8765/',wait_until='domcontentloaded')
              report=page.evaluate("""async (homepage) => {
                const out={};
                try {
                  const tts=await import('/patched-piper.mjs');
                  for(const [label,text] of [['short','Hallo, hier spricht Eva. Willkommen bei ODPC.'],['german','Ich unterstütze Unternehmen bei ihrer gesamten IT: von Arbeitsplätzen, Servern und Netzwerken über Software und Websites bis zur Automatisierung und KI-Integration.'],['homepage',homepage]]) {
                    try {
                      const b=await Promise.race([tts.predict({text,voiceId:'de_DE-eva_k-x_low'}),new Promise((_,reject)=>setTimeout(()=>reject(new Error('Synthesis timed out')),90000))]);
                      const bytes=await b.arrayBuffer(), ctx=new AudioContext(), a=await ctx.decodeAudioData(bytes.slice(0));
                      let peak=0;for(const x of a.getChannelData(0))peak=Math.max(peak,Math.abs(x));
                      let binary='';for(const x of new Uint8Array(bytes))binary+=String.fromCharCode(x);
                      out[label]={ok:a.duration>0&&peak>0,duration:a.duration,peak,wav:btoa(binary)};
                      await ctx.close();
                    } catch(e){out[label]={ok:false,error:String(e?.stack||e)}}
                  }
                } catch(e){out.setupError=String(e?.stack||e)}
                return out;
              }""", homepage)
              for name,result in report.items():
                  if isinstance(result,dict) and 'wav' in result:
                      pathlib.Path('eva-'+name+'.wav').write_bytes(base64.b64decode(result.pop('wav')))
              print('PIPER MAP REPORT',json.dumps(report,ensure_ascii=False),flush=True)
              browser.close()
              if not all(report.get(n,{}).get('ok') for n in ('short','german','homepage')):raise SystemExit('Mapping test failed')
          PY
      - name: Test real Speechable worker with Eva
        run: |
          mkdir -p vendor
          cp patched-piper.mjs vendor/odpc-eva-piper-20261113.mjs
          curl -fsSL https://raw.githubusercontent.com/oliverdering/odpc-sitebot/a4be918585688322fb373a8e2a7712d1badd56bb/scripts/speechable-eva/tts-worker.candidate.js -o tts-worker.js
          python3 -m http.server 8766 >/tmp/piper-worker-http.log 2>&1 &
          python3 - <<'PY'
          from playwright.sync_api import sync_playwright
          import json
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=['--no-sandbox'])
              page=browser.new_page()
              page.goto('http://localhost:8766/')
              result=page.evaluate("""async () => {
                 const w=new Worker('/tts-worker.js',{type:'module'});
                 return await new Promise((resolve)=>{
                   const timeout=setTimeout(()=>{w.terminate();resolve({error:'worker timeout'})},90000);
                   w.onerror=e=>{clearTimeout(timeout);w.terminate();resolve({error:e.message})};
                   w.onmessage=async e=>{
                     const m=e.data;
                     if(m.type==='ready')w.postMessage({type:'processChunk',data:{voiceId:'de_DE-eva_k-x_low',text:'Hallo, dies ist ein Test des ODPC Schwebebalkens.',chunkIndex:0}});
                     if(m.type==='error'){clearTimeout(timeout);w.terminate();resolve({error:m.error})}
                     if(m.type==='chunkComplete'){
                       try{let c=new AudioContext();let a=await c.decodeAudioData(m.result.audioBuffer.slice(0));let peak=0;for(const n of a.getChannelData(0))peak=Math.max(peak,Math.abs(n));
                         clearTimeout(timeout);w.terminate();resolve({duration:a.duration,peak,wordCount:m.result.wordCount});
                       }catch(e){clearTimeout(timeout);w.terminate();resolve({error:String(e)})}
                     }
                   };
                   w.postMessage({type:'init',data:{voiceId:'de_DE-eva_k-x_low'}});
                 });
              }""")
              print('WORKER TEST',json.dumps(result),flush=True)
              browser.close()
              assert result.get('duration',0)>0 and result.get('peak',0)>0 and result.get('wordCount',0)>0
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: piper-eva-test-audio
          path: eva-*.wav
          if-no-files-found: ignore
          retention-days: 2
