name: ODPC orchestra homepage hero release
on:
  push:
    branches: ['work/orchestra-hero-20261114']
    paths: ['.github/workflows/odpc-orchestra-hero-release.yml']
permissions:
  contents: read
concurrency:
  group: odpc-orchestra-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify tested source
        run: |
          test "$(git rev-parse HEAD:mission-control-hero/index.html)" = "d8ab30683c326109cbe41aabafb5d3f4b4a5e418"
          python3 -m py_compile mission-control-hero/deploy.py
      - run: python3 -m pip install 'paramiko>=3.4,<5'
      - name: Deploy one page with backup and verification
        env:
          ODPC_SFTP_PASSWORD: ${{ secrets.ODPC_SFTP_PASSWORD }}
          AI_ODPC_THEME_PATH: ${{ secrets.AI_ODPC_THEME_PATH }}
        run: python3 -m mission-control-hero.deploy
      - name: Preserve previous version
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orchestra-hero-previous
          path: orchestra-hero-backup/
          retention-days: 15
          if-no-files-found: ignore
