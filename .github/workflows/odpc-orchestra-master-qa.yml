name: ODPC Orchester Master isolated QA
on:
  push:
    branches: ['work/orchestra-master-20261114']
    paths: ['.github/workflows/odpc-orchestra-master-qa.yml']
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Test mobile choices and toolbar
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          (async()=>{const b=await chromium.launch({headless:true});const p=await b.newPage({viewport:{width:390,height:844}});
          await p.addInitScript(()=>{window.__speak=0;Object.defineProperty(window,'speechSynthesis',{value:{getVoices:()=>[],addEventListener:()=>{},cancel:()=>{},speak:u=>{window.__speak++;if(u.onstart)u.onstart()},speaking:false,pending:false,paused:false},configurable:true});window.SpeechSynthesisUtterance=function(s){this.text=s}});
          await p.route('https://translate.google.com/translate_a/element.js**',route=>route.fulfill({status:200,contentType:'application/javascript',body:'window.google={translate:{TranslateElement:function(){var c=document.createElement("select");c.className="goog-te-combo";["de","en","nl","fr","ru","tr","es"].forEach(x=>{var o=document.createElement("option");o.value=x;c.appendChild(o)});document.body.appendChild(c)}}};window.odpcGoogleTranslateInit()'}));
          const errors=[];p.on('pageerror',e=>errors.push(e.message));
          await p.goto('file://'+process.cwd()+'/mission-control-release-v2/index.html');
          await p.locator('#odpc-utility-dock').waitFor({timeout:10000});
          for(const d of ['android','ios','windows','macos'])for(const l of ['de','en','nl','fr','ru','tr','es'])for(const v of ['default','apple','android']){
          await p.locator('#setup-device').selectOption(d);await p.locator('#setup-language').selectOption(l);if(await p.locator('.odpc-language-fallback').inputValue()!==l)throw Error('dock language mismatch '+l);await p.locator('[data-view-choice="'+v+'"]').click();
          if(await p.locator('#setup-device').inputValue()!=d||await p.locator('#setup-language').inputValue()!=l||await p.locator('body').getAttribute('data-view')!=v)throw Error('state coupling '+d+l+v);
          }
          await p.locator('#odpc-reader-play').click();if(await p.evaluate(()=>window.__speak)<1)throw Error('speech callback failed');await p.locator('#odpc-reader-stop').click();
          await p.locator('.odpc-language-fallback').selectOption('tr');await p.waitForTimeout(800);if(await p.evaluate(()=>document.documentElement.lang)!=='tr')throw Error('translation bridge failed');
          if(await p.evaluate(()=>document.documentElement.scrollWidth>innerWidth+2))throw Error('mobile overflow');
          if(errors.length)throw Error('JS '+errors.join(';'));
          await p.screenshot({path:'master-mobile-qa.png',fullPage:true});await b.close();console.log('PASS: mobile selectors 84, original dock, speech mock, translation mock');})().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Check real translation provider
        run: |
          python3 -m http.server 8765 --directory mission-control-release-v2 > /tmp/odpc-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          node <<'JS'
          const {chromium}=require('playwright');
          (async()=>{const b=await chromium.launch({headless:true});const p=await b.newPage({viewport:{width:390,height:844}});await p.goto('http://127.0.0.1:8765/index.html');await p.locator('.odpc-language-fallback').waitFor();const before=await p.locator('h1').innerText();await p.locator('.odpc-language-fallback').selectOption('en');await p.waitForTimeout(20000);const after=await p.locator('h1').innerText();const status=await p.locator('#odpc-translation-status').innerText();console.log('ORIGINAL',before,'AFTER',after,'STATUS',status);if(before===after)throw Error('Real translation did not change page heading');await p.locator('.odpc-language-fallback').selectOption('de');await p.waitForFunction(original=>document.querySelector('h1')?.innerText===original,before,{timeout:35000});console.log('PASS return to German');await b.close();})().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Check all requested translation languages
        run: |
          python3 -m http.server 8766 --directory mission-control-release-v2 > /tmp/odpc-server2.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          node <<'JS'
          const {chromium}=require('playwright');
          (async()=>{const b=await chromium.launch({headless:true});for(const lang of ['en','nl','fr','ru','tr','es']){const c=await b.newContext({viewport:{width:390,height:844}});const p=await c.newPage();await p.goto('http://127.0.0.1:8766/index.html');await p.locator('.odpc-language-fallback').waitFor();const before=await p.locator('h1').innerText();await p.locator('.odpc-language-fallback').selectOption(lang);await p.waitForFunction(original=>document.querySelector('h1')?.innerText!==original,before,{timeout:35000});console.log('PASS provider translation',lang);await c.close()}await b.close()})().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Store screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: master-mobile-qa
          path: master-mobile-qa.png
          if-no-files-found: ignore

# Verify the updated language synchronization.
