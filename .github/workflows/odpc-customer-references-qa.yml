name: ODPC / Kundenreferenzen und Crosslinking QA
on:
  push:
    paths:
      - 'scripts/odpc_customer_references_audit.mjs'
      - '.github/workflows/odpc-customer-references-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check real customer-reference pages and crosslinks
        run: node scripts/odpc_customer_references_audit.mjs
