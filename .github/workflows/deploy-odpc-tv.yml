name: Deploy ODPC TV
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install paramiko
      - name: Deploy TV plugin to existing WordPress installation
        env:
          ODPC_SFTP_PASSWORD: ${{ secrets.ODPC_SFTP_PASSWORD }}
          ODPC_WORDPRESS_ROOT: ${{ vars.ODPC_WORDPRESS_ROOT }}
        run: python scripts/deploy_odpc_tv.py
