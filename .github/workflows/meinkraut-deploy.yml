name: Mein Kraut / Validated beta deployment
on:
  push:
    paths:
      - 'site-deploy/meinkraut/**'
      - 'scripts/deploy_meinkraut.py'
      - 'scripts/test_meinkraut.cjs'
      - 'deployment/meinkraut-bootstrap.json'
      - '.github/workflows/meinkraut-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: meinkraut-release
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate application and data
        run: |
          node --check site-deploy/meinkraut/meinkraut.js
          node scripts/test_meinkraut.cjs
          find site-deploy/meinkraut -name '*.php' -exec php -l {} \;
          python3 -m py_compile scripts/deploy_meinkraut.py
      - run: python3 -m pip install 'paramiko>=3.4,<5'
      - name: Deploy new webspace with backup
        env:
          ODPC_SFTP_PASSWORD: ${{ secrets.ODPC_SFTP_PASSWORD }}
        run: python3 scripts/deploy_meinkraut.py
      - name: Retain prior public application files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meinkraut-prior-release
          path: backup-meinkraut/
          if-no-files-found: ignore
          retention-days: 15
