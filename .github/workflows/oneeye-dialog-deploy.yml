name: ODPC / one.eye dialogue release
on:
  pull_request:
    branches: [main]
    paths:
      - 'site-deploy/odpc.de/odpc-oneeye-dialog.php'
      - 'scripts/deploy_oneeye_dialog.py'
      - '.github/workflows/oneeye-dialog-deploy.yml'
  push:
    branches: [main]
    paths:
      - 'site-deploy/odpc.de/odpc-oneeye-dialog.php'
      - 'scripts/deploy_oneeye_dialog.py'
      - '.github/workflows/oneeye-dialog-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: odpc-oneeye-dialog-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax and scope checks
        run: |
          php -l site-deploy/odpc.de/odpc-oneeye-dialog.php
          python -m py_compile scripts/deploy_oneeye_dialog.py
          grep -q 'oneeye-combined-greeting' site-deploy/odpc.de/odpc-oneeye-dialog.php
      - name: Install SFTP client
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: python -m pip install 'paramiko>=3.4,<5'
      - name: Publish dialogue and verify public page
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          ODPC_SFTP_PASSWORD: ${{ secrets.ODPC_SFTP_PASSWORD }}
        run: python scripts/deploy_oneeye_dialog.py
      - name: Save rollback artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odpc-oneeye-dialog-previous-file
          path: odpc-oneeye-dialog-backup/
          if-no-files-found: ignore
          retention-days: 15
