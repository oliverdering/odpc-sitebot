name: D.R.O.L. / Seed verified editorial registry
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/drol-db-seed.yml'
permissions:
  contents: read
concurrency:
  group: drol-db-production
  cancel-in-progress: false
jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate seed and backup scripts
        run: python3 -m py_compile scripts/drol_ionos_db_seed.py scripts/drol_ionos_db_backup.py scripts/drol_ionos_db_inventory.py
      - name: Install SFTP library
        run: python3 -m pip install 'paramiko>=3.4,<5'
      - name: Back up all production tables
        env:
          ODPC_SFTP_PASSWORD: ${{ secrets.ODPC_SFTP_PASSWORD }}
          DROL_DB_PASSWORD: ${{ secrets.DROL_DB_PASSWORD }}
        run: python3 scripts/drol_ionos_db_backup.py
      - name: Store pre-import backup
        uses: actions/upload-artifact@v4
        with:
          name: drol-pre-seed-backup
          path: drol-db-backup.json
          if-no-files-found: error
          retention-days: 1
      - name: Import reviewed editorial model registry
        env:
          ODPC_SFTP_PASSWORD: ${{ secrets.ODPC_SFTP_PASSWORD }}
          DROL_DB_PASSWORD: ${{ secrets.DROL_DB_PASSWORD }}
        run: python3 scripts/drol_ionos_db_seed.py
      - name: Verify live inventory
        env:
          ODPC_SFTP_PASSWORD: ${{ secrets.ODPC_SFTP_PASSWORD }}
          DROL_DB_PASSWORD: ${{ secrets.DROL_DB_PASSWORD }}
        run: python3 scripts/drol_ionos_db_inventory.py
