name: Tante Lenchen / Full theme deploy
on:
  push:
    paths:
      - 'site-deploy/tante-lenchen/**'
      - 'scripts/deploy_lenchen_full.py'
      - '.github/workflows/tante-lenchen-full-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tante-lenchen-full-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate theme PHP and deploy script
        run: |
          python3 -m py_compile scripts/deploy_lenchen_full.py
          for file in site-deploy/tante-lenchen/*.php; do php -l "$file"; done
      - name: Install SFTP client
        run: python3 -m pip install 'paramiko>=3.4,<5'
      - name: Deploy full theme to Lenchen only
        env:
          ODPC_SFTP_PASSWORD: ${{ secrets.ODPC_SFTP_PASSWORD }}
        run: python3 scripts/deploy_lenchen_full.py
