name: ODPC / WordPress Core Integrity Read-Only Audit
on:
  push:
    paths:
      - 'scripts/audit_odpc_core_readonly.py'
      - '.github/workflows/odpc-core-integrity-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check and SFTP dependency
        run: |
          python3 -m py_compile scripts/audit_odpc_core_readonly.py
          python3 -m pip install 'paramiko>=3.4,<5'
      - name: Inspect checksum anomalies without changing WordPress
        env:
          ODPC_SFTP_PASSWORD: ${{ secrets.ODPC_SFTP_PASSWORD }}
        run: python3 scripts/audit_odpc_core_readonly.py
