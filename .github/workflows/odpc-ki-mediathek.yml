name: ODPC KI-Mediathek
on:
  schedule:
    - cron: '0 6 * * *'
      timezone: Europe/Berlin
  workflow_dispatch:
    inputs:
      operation:
        description: Aktualisieren, Vorgängerversion wiederherstellen oder Betrieb fortsetzen
        type: choice
        default: refresh
        options: [refresh, legacy, resume]
  push:
    branches: [main]
    paths:
      - 'ki-mediathek/**'
      - '.github/workflows/odpc-ki-mediathek.yml'
permissions:
  contents: read
concurrency:
  group: odpc-ki-mediathek-production
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: PHP, JavaScript und Python prüfen
        run: |
          php -l ki-mediathek/portal.php
          node --check ki-mediathek/portal.js
          python -m py_compile ki-mediathek/collect.py ki-mediathek/deploy.py
          python ki-mediathek/test_catalogue.py
      - run: python -m pip install 'paramiko>=3.4,<5'
      - name: Aktualisieren und öffentliche Seite prüfen
        env:
          ODPC_SFTP_PASSWORD: ${{ secrets.ODPC_SFTP_PASSWORD }}
          MODE: ${{ inputs.operation || 'refresh' }}
        run: python ki-mediathek/deploy.py "$MODE"
  browser:
    if: github.event_name != 'schedule' && inputs.operation != 'legacy'
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Chromium und WebKit vorbereiten
        run: |
          npm install --prefix "$RUNNER_TEMP/ki-qa" playwright@1.56.1 --no-audit --no-fund
          "$RUNNER_TEMP/ki-qa/node_modules/.bin/playwright" install --with-deps webkit
      - name: Öffentliche Seite und Startseitenbanner bedienen
        run: NODE_PATH="$RUNNER_TEMP/ki-qa/node_modules" node ki-mediathek/acceptance.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ki-mediathek-browseransichten
          path: ${{ runner.temp }}/ki-media-acceptance/*.png
          if-no-files-found: ignore
          retention-days: 7
