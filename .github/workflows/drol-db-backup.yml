name: D.R.O.L. / Private database backup
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/drol_ionos_db_backup.py'
      - '.github/workflows/drol-db-backup.yml'
permissions:
  contents: read
concurrency:
  group: drol-private-backup
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate backup code
        run: python3 -m py_compile scripts/drol_ionos_db_backup.py
      - name: Install SFTP client
        run: python3 -m pip install 'paramiko>=3.4,<5'
      - name: Back up D.R.O.L. database via IONOS-local PHP
        env:
          ODPC_SFTP_PASSWORD: ${{ secrets.ODPC_SFTP_PASSWORD }}
          DROL_DB_PASSWORD: ${{ secrets.DROL_DB_PASSWORD }}
        run: python3 scripts/drol_ionos_db_backup.py
      - name: Upload private backup artifact (1-day retention)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: drol-database-backup
          path: drol-db-backup.json
          if-no-files-found: error
          retention-days: 1
