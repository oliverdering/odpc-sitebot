name: ODPC orchestra two-design release
on:
  push:
    branches: ['work/orchestra-designs-20261114']
    paths: ['.github/workflows/odpc-orchestra-designs-release.yml']
permissions:
  contents: read
concurrency:
  group: odpc-orchestra-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify tested source
        run: |
          test "$(git rev-parse HEAD:mission-control-designs/index.html)" = "93faa0712fead36f87fc06de9cc764e796230cbf"
          python3 -m py_compile mission-control-designs/deploy.py
      - run: python3 -m pip install 'paramiko>=3.4,<5'
      - name: Deploy one page with backup and verification
        env:
          ODPC_SFTP_PASSWORD: ${{ secrets.ODPC_SFTP_PASSWORD }}
          AI_ODPC_THEME_PATH: ${{ secrets.AI_ODPC_THEME_PATH }}
        run: python3 -m mission-control-designs.deploy
      - name: Preserve previous version
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orchestra-designs-previous
          path: orchestra-designs-backup/
          retention-days: 15
          if-no-files-found: ignore
